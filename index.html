  display:flex;
  flex-direction:column;
  padding:22px 14px;
}
.brand{
  display:flex;align-items:center;justify-content:center;gap:10px;
  padding:4px 8px 22px 8px;
}
.brand-text{line-height:1.1;min-width:0;display:flex;flex-direction:column;align-items:center;text-align:center;}
.brand-text .brand-logo-img{height:16px;width:auto;display:block;filter:brightness(0) invert(1);}
.brand-text .t2{font-size:10.5px;color:#9db4d6;letter-spacing:.4px;text-transform:uppercase;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px;}

.nav{display:flex;flex-direction:column;gap:3px;margin-top:6px;}
.nav-item{
  display:flex;align-items:center;gap:11px;
  padding:10px 12px;border-radius:10px;
  color:#b9c8e0;font-size:13.5px;font-weight:600;
  background:transparent;border:none;text-align:left;width:100%;
  transition:background .15s, color .15s;
}
.nav-item svg{width:17px;height:17px;flex-shrink:0;opacity:.85;}
.nav-item:hover{background:rgba(255,255,255,.06);}
.nav-item.active{background:rgba(185,217,235,.16);box-shadow:inset 0 0 0 1px rgba(185,217,235,.4);}
.nav-item.active svg{opacity:1;}
.nav-badge{
  margin-left:auto;background:var(--danger);color:#fff;font-size:10px;font-weight:700;
  padding:1px 6px;border-radius:20px;
}
.nav-section-label{
  font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#5f7796;
  margin:16px 12px 4px;font-weight:700;
}
.nav-group{margin:2px 0;}
.nav-group-label{
  display:flex;align-items:center;gap:11px;padding:10px 12px;width:100%;
  background:transparent;border:none;text-align:left;cursor:pointer;
  color:#7891ac;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;
  border-radius:10px;transition:background .15s,color .15s;
}
.nav-group-label:hover{background:rgba(255,255,255,.06);}
.nav-group-label svg{width:14px;height:14px;flex-shrink:0;opacity:.7;}
.nav-group-label .nav-badge{margin-left:auto;}
.nav-group-caret{margin-left:auto;transition:transform .2s var(--ease);display:flex;}
.nav-group-label .nav-badge + .nav-group-caret{margin-left:6px;}
.nav-group.open .nav-group-caret{transform:rotate(90deg);}
.nav-group-children{
  display:none;
}
.nav-group-children-inner{
  overflow:hidden;display:flex;flex-direction:column;gap:3px;
  padding:3px 0 2px 14px;border-left:1px solid rgba(255,255,255,.08);margin-left:20px;
}
.nav-group.open .nav-group-children{display:block;}
.nav-group-children .nav-item{font-size:13px;padding:8px 12px;}
.sidebar-footer{
  margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,.08);
  display:flex;align-items:center;gap:10px;padding-left:8px;
}
.avatar-sm{
  width:30px;height:30px;border-radius:50%;background:var(--blue);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0;
  overflow:hidden;
}
.avatar-sm img{width:100%;height:100%;object-fit:cover;}
.sf-clickable{cursor:pointer;}
.profile-avatar{
  width:64px;height:64px;border-radius:50%;background:var(--blue);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;
  overflow:hidden;flex-shrink:0;
}
.profile-avatar img{width:100%;height:100%;object-fit:cover;}
.sidebar-footer .who{font-size:12.5px;font-weight:700;color:#fff;}
.sidebar-footer .role{font-size:10.5px;color:#9db4d6;}
.sidebar{transition:width .22s var(--ease), min-width .22s var(--ease);cursor:default;}
.sidebar.collapsed{width:74px;min-width:74px;}
.sidebar.collapsed .brand{justify-content:center;padding:4px 0 22px;}
.sidebar.collapsed .brand-text{display:none;}
.sidebar.collapsed .nav-item{justify-content:center;padding:10px;}
.sidebar.collapsed .nav-item span:not(.nav-badge){display:none;}
.sidebar.collapsed .nav-item{position:relative;}
.sidebar.collapsed .nav-badge{position:absolute;top:4px;right:4px;padding:1px 4px;font-size:8px;}
.sidebar.collapsed .sidebar-footer{padding-left:0;justify-content:center;flex-wrap:wrap;gap:6px;}
.sidebar.collapsed .sidebar-footer .sf-info{display:none;}
.sidebar.collapsed .sidebar-powered{display:none;}
.sidebar.collapsed .nav-section-label{display:none;}
.sidebar.collapsed .nav-group-label{display:none;}
.sidebar.collapsed .nav-group-children{display:block;}
.sidebar.collapsed .nav-group-children-inner{padding-left:0;border-left:none;margin-left:0;}
.sidebar-powered{
  display:flex;align-items:center;gap:6px;padding:12px 8px 2px;margin-top:8px;
  font-size:9.5px;color:#7891ac;font-weight:600;
}
.sidebar-powered img{height:11px;width:auto;opacity:.8;filter:brightness(0) invert(1);}
.sidebar-powered .sp-sep{opacity:.5;}

/* ===== MAIN ===== */
.main{flex:1;display:flex;flex-direction:column;min-width:0;height:100vh;}
.topbar{
  height:66px;min-height:66px;background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:14px;padding:0 22px;
}
.page-title{font-size:18px;font-weight:800;font-family:'Poppins';margin-right:6px;white-space:nowrap;}
.search-box{
  display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--border);
  border-radius:10px;padding:8px 12px;width:260px;
}
.search-box input{border:none;background:transparent;outline:none;font-size:13px;width:100%;color:var(--text);}
.search-box svg{width:15px;height:15px;color:var(--text-faint);flex-shrink:0;}
.group-filter{
  border:1px solid var(--border);background:var(--sky-tint);color:var(--sky-deep);border-radius:9px;
  padding:8px 12px;font-size:12.5px;font-weight:700;outline:none;max-width:200px;
}
.topbar-spacer{flex:1;}
.btn{
  display:inline-flex;align-items:center;gap:7px;
  border-radius:10px;border:1px solid var(--border);background:var(--surface);
  padding:9px 14px;font-size:13px;font-weight:700;color:var(--text);
  white-space:nowrap;transition:all .15s;text-decoration:none;
}
.btn:hover{border-color:#c9d5e8;background:#fafbfe;}
.btn svg{width:15px;height:15px;}
.btn-primary{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 2px 8px rgba(47,111,237,.35);}
.btn-primary:hover{background:var(--blue-600);border-color:var(--blue-600);}
.btn-ghost{border-color:transparent;background:transparent;}
.btn-ghost:hover{background:var(--bg);}
.btn-sm{padding:6px 10px;font-size:12px;border-radius:8px;}
.btn-success{background:var(--success);border-color:var(--success);color:#fff;}
.btn-warning{background:var(--warning);border-color:var(--warning);color:#fff;}
.btn-danger{background:var(--danger);border-color:var(--danger);color:#fff;}
.btn-wpp{background:#1FAA57;border-color:#1FAA57;color:#fff;box-shadow:0 2px 8px rgba(31,170,87,.3);}
.btn-wpp:hover{background:#199049;}
.icon-btn{
  width:34px;height:34px;border-radius:9px;border:1px solid var(--border);background:var(--surface);
  display:flex;align-items:center;justify-content:center;color:var(--text-muted);flex-shrink:0;
}
.icon-btn:hover{background:var(--bg);}
.icon-btn svg{width:16px;height:16px;}

.view{flex:1;min-height:0;overflow:hidden;display:none;}
.view.active{display:flex;flex-direction:column;}
#views{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;}

/* filter bar */
.filterbar{
  display:none;align-items:center;gap:8px;flex-wrap:wrap;
  padding:12px 22px;border-bottom:1px solid var(--border);background:var(--surface);
}
.filterbar.mobile-open{display:flex;}
.filterbar select, .filterbar input[type=date]{
  border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:12.5px;color:var(--text);background:var(--bg);
  outline:none;
}
.filter-clear{font-size:12px;color:var(--blue);font-weight:700;background:none;border:none;padding:6px 4px;}
.filter-date-group{display:inline-flex;align-items:center;gap:6px;}
.filter-date-group select, .filter-date-group input[type=date]{
  border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:12.5px;color:var(--text);background:var(--bg);outline:none;
}
.filter-date-sep{font-size:11px;color:var(--text-faint);font-weight:600;}
.admin-filter-select{
  appearance:none;-webkit-appearance:none;-moz-appearance:none;
  border:1px solid var(--border);border-radius:10px;background-color:var(--bg);color:var(--text);
  padding:9px 32px 9px 14px;font-size:12.5px;font-weight:700;outline:none;cursor:pointer;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2364748B' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l6 6 6-6'/></svg>");
  background-repeat:no-repeat;background-position:right 11px center;background-size:12px;
  transition:border-color .15s,box-shadow .15s;
}
.admin-filter-select:hover{border-color:#c9d5e8;}
.admin-filter-select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(33,67,69,.12);}
.global-footer-bar{
  position:fixed;left:50%;bottom:10px;transform:translateX(-50%);z-index:60;
  min-height:auto;padding:7px 18px;border:1px solid var(--border);border-radius:20px;background:var(--surface);
  display:flex;align-items:center;justify-content:center;gap:10px;text-align:center;box-shadow:var(--shadow-md);
  max-width:min(90vw,560px);
}
.global-footer-bar .gf-text{font-size:11.5px;color:var(--text-muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.global-footer-bar .gf-text:empty{display:none;}
.global-footer-bar .gf-edit{
  width:22px;height:22px;border-radius:7px;border:1px solid var(--border);background:var(--bg);color:var(--text-faint);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.global-footer-bar .gf-edit svg{width:11px;height:11px;}
.global-footer-bar .gf-edit:hover{color:var(--blue);border-color:var(--blue);}
.col-toggle-row{display:flex;align-items:center;gap:10px;padding:9px 6px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;}
.col-toggle-row:hover{background:var(--bg);}
.col-toggle-row input{width:15px;height:15px;flex-shrink:0;}

/* ===== KANBAN ===== */
.kanban-wrap{flex:1;min-height:0;overflow-x:auto;overflow-y:hidden;padding:16px 22px;display:flex;gap:14px;align-items:flex-start;background:var(--bg);}
.kanban-col{
  min-width:272px;max-width:272px;background:#EDF1F9;border-radius:var(--radius-md);
  display:flex;flex-direction:column;max-height:100%;
}
.kanban-col.drag-over{outline:2px dashed var(--blue);outline-offset:-2px;background:#e2ebfc;}
.kanban-col-head{
  padding:12px 12px 8px;display:flex;align-items:center;gap:8px;
}
.col-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.col-title{font-size:12.5px;font-weight:800;font-family:'Poppins';flex:1;letter-spacing:.2px;}
.col-count{font-size:11px;font-weight:700;color:var(--text-muted);background:#fff;border-radius:20px;padding:1px 8px;}
.col-sum{font-size:11px;color:var(--text-muted);padding:0 12px 10px;font-weight:600;}
.kanban-cards{flex:1;overflow-y:auto;padding:2px 8px 10px;display:flex;flex-direction:column;gap:8px;min-height:40px;}

.card{
  background:var(--surface);border-radius:var(--radius-sm);padding:11px 12px;
  border:1px solid var(--border);box-shadow:var(--shadow-sm);cursor:grab;
  transition:box-shadow .15s, transform .1s;
  position:relative;
}
.card:hover{box-shadow:var(--shadow-md);transform:translateY(-1px);}
.card.dragging{opacity:.4;}
.card-del-btn{
  position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:6px;border:none;
  background:var(--surface);color:var(--text-faint);display:flex;align-items:center;justify-content:center;
  opacity:.55;transition:opacity .15s, background .15s, color .15s;box-shadow:var(--shadow-sm);
}
.card-del-btn svg{width:12px;height:12px;}
.card:hover .card-del-btn{opacity:1;}
.card-del-btn:hover{background:var(--danger-light);color:var(--danger);opacity:1;}
.card-deleted{background:var(--surface-alt);opacity:.85;cursor:default;}
.card-deleted .card-name{color:var(--text-muted);}
.card-deleted .card-origin{background:var(--danger-light);color:var(--danger);}
.delete-reason{font-size:11.5px;color:var(--text-muted);margin-top:6px;font-style:italic;line-height:1.4;}
.delete-meta{font-size:10px;color:var(--text-faint);margin-top:4px;}
.kanban-col-deleted{background:var(--surface-alt);}
.show-deleted-toggle{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--text-muted);cursor:pointer;margin-left:auto;}
.show-deleted-toggle input{width:14px;height:14px;}
.billing-reminder{
  display:flex;align-items:flex-start;gap:10px;background:var(--warning-light);color:#8a5a06;
  padding:12px 14px;border-radius:var(--radius-md);font-size:12.5px;font-weight:600;line-height:1.5;margin-bottom:16px;
}
.billing-reminder svg{width:16px;height:16px;flex-shrink:0;margin-top:1px;}
#adminMiniDash{
  display:flex;align-items:center;gap:22px;padding:9px 22px;background:var(--surface-alt);
  border-bottom:1px solid var(--border);flex-shrink:0;
}
#adminMiniDash:empty{display:none;padding:0;border:none;}
.mini-dash-title{font-size:12px;font-weight:800;color:var(--text);}
.mini-dash-stat{display:flex;align-items:center;gap:6px;font-size:12px;}
.mini-dash-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.mini-dash-label{color:var(--text-muted);font-weight:600;}
.mini-dash-count{font-weight:800;color:var(--text);}
.mini-dash-value{color:var(--text-faint);}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;padding-right:22px;}
.card-name{font-size:13px;font-weight:700;color:var(--text);}
.card-origin{font-size:9.5px;font-weight:700;color:var(--blue);background:var(--blue-light);padding:2px 6px;border-radius:6px;white-space:nowrap;}
.card-sub{font-size:11.5px;color:var(--text-muted);margin-top:3px;}
.card-meta{display:flex;justify-content:space-between;align-items:center;margin-top:9px;}
.card-premium{font-size:12px;font-weight:800;color:var(--navy);font-family:'Poppins';}
.card-owner{
  width:22px;height:22px;border-radius:50%;background:var(--navy-800);color:#fff;
  font-size:9.5px;font-weight:700;display:flex;align-items:center;justify-content:center;
}
.card-flag{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;margin-top:7px;padding:2px 7px;border-radius:6px;}
.ind-card .card-name{white-space:nowrap;overflow:hidden;text-overflow:clip;max-width:70%;}
.ind-card .card-sub{white-space:nowrap;overflow:hidden;text-overflow:clip;}
.ind-card-ts{font-size:10px;color:var(--text-faint);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:clip;}
.flag-red{background:var(--danger-light);color:var(--danger);}
.flag-yellow{background:var(--warning-light);color:#b5750a;}
.flag-green{background:var(--success-light);color:var(--success);}

/* ===== Scrollable generic content page ===== */
.page-scroll{flex:1;overflow-y:auto;padding:22px;}

/* ===== DASHBOARD ===== */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px;}
.dash-period-bar{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--surface-alt);border:1px solid var(--border);
  border-radius:var(--radius-md);padding:10px 14px;margin-bottom:16px;font-size:12px;
}
.dash-period-bar .dpb-label{font-weight:800;color:var(--text);}
.dash-period-bar .dpb-sep{color:var(--text-faint);}
.dash-period-bar label{color:var(--text-muted);font-weight:600;}
.dash-period-bar input[type=date]{border:1px solid var(--border);border-radius:8px;padding:5px 8px;font-size:12px;background:var(--bg);outline:none;}
.kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:16px 18px;box-shadow:var(--shadow-sm);}
.kpi-label{font-size:11.5px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.4px;display:flex;align-items:center;gap:6px;}
.kpi-value{font-family:'Poppins';font-size:24px;font-weight:800;color:var(--navy);margin-top:8px;}
.kpi-sub{font-size:11.5px;color:var(--text-faint);margin-top:4px;font-weight:600;}
.kpi-icon{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}

.grid-2{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;margin-bottom:14px;}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:14px;}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:18px;box-shadow:var(--shadow-sm);}
.panel-title{font-family:'Poppins';font-size:14px;font-weight:800;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;}
.panel-title span.tag{font-size:10.5px;font-weight:700;color:var(--text-muted);background:var(--bg);padding:3px 9px;border-radius:20px;}
.chart-box{position:relative;height:230px;}
.chart-box.tall{height:270px;}

.rank-list{display:flex;flex-direction:column;gap:10px;}
.rank-row{display:flex;align-items:center;gap:10px;}
.rank-idx{width:20px;height:20px;border-radius:6px;background:var(--blue-light);color:var(--blue);font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.rank-name{font-size:12.5px;font-weight:700;flex:1;}
.rank-val{font-size:12px;font-weight:700;color:var(--text-muted);}

/* ===== TASKS ===== */
.task-toolbar{display:flex;gap:8px;align-items:center;padding:14px 22px;border-bottom:1px solid var(--border);background:var(--surface);flex-wrap:wrap;}
.task-cols{display:flex;gap:14px;padding:16px 22px;flex:1;overflow-x:auto;background:var(--bg);}
.task-col{min-width:280px;max-width:280px;display:flex;flex-direction:column;}
.task-col-head{font-family:'Poppins';font-size:12.5px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.task-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px 12px;margin-bottom:9px;box-shadow:var(--shadow-sm);}
.task-item.done{opacity:.55;}
.task-item.done .task-title{text-decoration:line-through;}
.task-title{font-size:12.5px;font-weight:700;}
.task-client{font-size:11px;color:var(--blue);font-weight:600;margin-top:3px;}
.task-foot{display:flex;justify-content:space-between;align-items:center;margin-top:9px;}
.task-badge{font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:6px;}
.task-due{font-size:10.5px;color:var(--text-muted);font-weight:600;}
.priority-alta{background:var(--danger-light);color:var(--danger);}
.priority-media{background:var(--warning-light);color:#b5750a;}
.priority-baixa{background:#EEF1F6;color:var(--text-muted);}

/* ===== AGENDA ===== */
.agenda-toolbar{display:flex;align-items:center;gap:10px;padding:14px 22px;border-bottom:1px solid var(--border);background:var(--surface);}
.agenda-toolbar .seg{display:flex;background:var(--bg);border-radius:9px;padding:3px;border:1px solid var(--border);}
.seg-btn{padding:6px 13px;font-size:12px;font-weight:700;border-radius:7px;background:transparent;border:none;color:var(--text-muted);}
.seg-group{display:inline-flex;background:var(--bg);border-radius:9px;padding:3px;border:1px solid var(--border);gap:2px;}
.seg-btn.active{background:var(--surface);color:var(--navy);box-shadow:var(--shadow-sm);}
.agenda-body{flex:1;overflow-y:auto;padding:18px 22px;}
.agenda-day-group{margin-bottom:18px;}
.agenda-day-label{font-family:'Poppins';font-weight:800;font-size:13px;color:var(--navy);margin-bottom:8px;padding-bottom:6px;border-bottom:2px solid var(--blue-light);}
.agenda-item{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:7px;box-shadow:var(--shadow-sm);}
.agenda-time{font-size:11.5px;font-weight:800;color:var(--blue);width:56px;flex-shrink:0;}
.agenda-info{flex:1;}
.agenda-info .t{font-size:12.5px;font-weight:700;}
.agenda-info .s{font-size:11px;color:var(--text-muted);margin-top:2px;}

/* ===== RENOVACOES ===== */
.renewal-groups{display:flex;flex-direction:column;gap:20px;}
.renewal-group-title{display:flex;align-items:center;gap:9px;font-family:'Poppins';font-weight:800;font-size:14px;margin-bottom:10px;}
.renewal-dot{width:10px;height:10px;border-radius:50%;}
.renewal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.renewal-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:14px 15px;box-shadow:var(--shadow-sm);}
.renewal-card .rc-top{display:flex;justify-content:space-between;align-items:flex-start;}
.renewal-card .rc-name{font-size:13px;font-weight:800;font-family:'Poppins';}
.renewal-card .rc-days{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:6px;white-space:nowrap;}
.renewal-card .rc-sub{font-size:11.5px;color:var(--text-muted);margin-top:4px;}
.renewal-card .rc-premium{font-size:14px;font-weight:800;color:var(--navy);margin-top:9px;font-family:'Poppins';}
.renewal-card .rc-actions{display:flex;gap:7px;margin-top:11px;}
.renewal-card .rc-actions .btn{flex:1;justify-content:center;padding:7px;font-size:11.5px;}

/* ===== EMPTY ===== */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;color:var(--text-faint);text-align:center;}
.empty-state svg{width:44px;height:44px;margin-bottom:12px;opacity:.5;}
.empty-state .e-title{font-weight:700;color:var(--text-muted);font-size:13.5px;}
.empty-state .e-sub{font-size:12px;margin-top:4px;}

/* ===== MODAL ===== */
.modal-overlay{
  position:fixed;inset:0;background:rgba(8,27,49,.55);backdrop-filter:blur(2px);
  display:none;align-items:center;justify-content:center;z-index:100;padding:24px;
  opacity:0;transition:opacity .2s var(--ease);
}
.modal-overlay.active{display:flex;opacity:1;}
.modal{
  background:var(--surface);border-radius:20px;width:100%;box-shadow:var(--shadow-lg);
  display:flex;flex-direction:column;overflow:hidden;
  animation:modalIn .28s var(--ease);
}
@keyframes modalIn{ from{opacity:0; transform:translateY(14px) scale(.97);} to{opacity:1; transform:translateY(0) scale(1);} }
.modal-client{max-width:840px;max-height:88vh;}
.modal-apolice{height:80vh;max-height:80vh;}
.modal-apolice .modal-body{flex:1;min-height:0;overflow-y:auto;padding:20px 22px;}
@media (max-width:600px){ .modal-apolice{height:86vh;max-height:86vh;} }
.modal-small{max-width:460px;max-height:88vh;}
.modal-small .modal-body{overflow-y:auto;}
.modal-task{max-width:520px;}
.modal-large{max-width:920px;max-height:88vh;}
.modal-large .modal-body{overflow-y:auto;}
.sinistro-sub-tab{border:1px solid var(--border);border-radius:var(--radius-md);padding:12px 14px;margin-top:4px;margin-bottom:14px;background:var(--surface-alt);}
.sinistro-sub-tab-title{font-size:11px;font-weight:800;color:var(--text-muted);text-transform:uppercase;margin-bottom:10px;}
.sinistro-card{border:1px solid var(--border);border-radius:var(--radius-md);padding:12px 14px;background:var(--surface-alt);}
.sinistro-card-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.sinistro-tipo-badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;padding:5px 10px;border-radius:20px;}
.sinistro-tipo-badge svg{width:13px;height:13px;}
.tipo-sinistro{background:var(--danger-light);color:var(--danger);}
.tipo-assistencia{background:var(--sky-tint);color:var(--sky-deep);}
.sinistro-status-select{border:1px solid var(--border);border-radius:8px;padding:5px 8px;font-size:11.5px;font-weight:700;background:var(--bg);color:var(--text);outline:none;}
.sinistro-status-badge{font-size:11px;font-weight:800;padding:4px 10px;border-radius:20px;}
.sinistro-status-badge.status-aberto{background:var(--danger-light);color:var(--danger);}
.sinistro-status-badge.status-andamento{background:var(--warning-light);color:var(--warning);}
.sinistro-status-badge.status-concluido{background:var(--success-light);color:var(--success);}
.sinistro-status-badge.status-indeferido{background:var(--surface-alt);color:var(--text-faint);border:1px solid var(--border);}
.sinistro-card-sub{font-size:11.5px;color:var(--text-muted);margin-top:6px;}
.sinistro-card-desc{font-size:12.5px;color:var(--text);margin-top:6px;line-height:1.5;}
.sinistro-card-foot{font-size:10.5px;color:var(--text-faint);margin-top:8px;}
.perm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px;}
.perm-group-title{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:800;font-size:13px;color:var(--navy);margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--border);}
.perm-group-toggle{display:flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;color:var(--text-muted);cursor:pointer;text-transform:none;}
.perm-group-toggle input{width:14px;height:14px;accent-color:var(--blue);}
.perm-group-toggle.perm-locked{opacity:.5;cursor:not-allowed;}
.perm-item{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:5px 0;cursor:pointer;color:var(--text-muted);}
.perm-item input{width:16px;height:16px;accent-color:var(--blue);flex-shrink:0;}
.perm-item.perm-locked{color:var(--text-faint);cursor:not-allowed;}
.perm-lock-icon{font-size:10px;margin-left:auto;opacity:.6;}
.modal-head{
  padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;
  background:linear-gradient(135deg,var(--navy),var(--navy-800));color:#fff;
}
.modal-head .mh-avatar{
  width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.15);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-family:'Poppins';flex-shrink:0;
}
.modal-head .mh-info{flex:1;min-width:0;}
.modal-head .mh-name{font-family:'Poppins';font-weight:800;font-size:16px;}
.modal-head .mh-sub{font-size:11.5px;color:#b9c8e0;margin-top:2px;}
.modal-close{
  width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,.12);border:none;color:#fff;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.modal-close svg{width:15px;height:15px;}
.modal-body{flex:1;overflow-y:auto;padding:0;}
.modal-foot{padding:14px 22px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end;background:var(--bg);}

.tabs{display:flex;gap:2px;padding:0 22px;border-bottom:1px solid var(--border);background:var(--surface);}
.tab-btn{padding:13px 4px;margin-right:20px;font-size:12.5px;font-weight:700;color:var(--text-muted);background:none;border:none;border-bottom:2px solid transparent;}
.tab-btn.active{color:var(--blue);border-bottom-color:var(--blue);}
.tab-panel{display:none;padding:20px 22px;}
.tab-panel.active{display:block;}

.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.insurer-field-grid{grid-template-columns:1fr 1fr;gap:16px 24px;}
@media (min-width:760px){ .insurer-field-grid{grid-template-columns:1fr 1fr 1fr;} .insurer-field-grid .field.full{grid-column:1/-1;} }
.field{display:flex;flex-direction:column;gap:5px;}
.field.full{grid-column:1/-1;}
.field label{font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.3px;}
.field input,.field select,.field textarea{
  border:1px solid var(--border);border-radius:9px;padding:9px 11px;font-size:13px;color:var(--text);
  outline:none;background:var(--bg);width:100%;box-sizing:border-box;height:40px;
}
.field textarea{height:auto;}
.field select{appearance:auto;-webkit-appearance:menulist;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);background:#fff;}
.field textarea{resize:vertical;min-height:70px;font-family:inherit;}
.field input.field-error{border-color:var(--danger);background:var(--danger-light);animation:fieldShake .35s;}
@keyframes fieldShake{ 10%,90%{transform:translateX(-1px);} 20%,80%{transform:translateX(2px);} 30%,50%,70%{transform:translateX(-4px);} 40%,60%{transform:translateX(4px);} }

.wpp-block{background:var(--success-light);border:1px solid #bfe9d4;border-radius:var(--radius-md);padding:14px;margin-bottom:16px;}
.wpp-block-top{display:flex;align-items:center;justify-content:between;gap:10px;margin-bottom:10px;}
.wpp-quick{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px;}
.wpp-chip{
  font-size:11.5px;font-weight:700;background:#fff;border:1px solid #bfe9d4;color:#0f7a45;
  padding:6px 11px;border-radius:20px;
}
.wpp-chip:hover{background:#e7f9f1;}

.hist-list{display:flex;flex-direction:column;gap:10px;margin-top:14px;}
.hist-item{background:var(--bg);border-radius:10px;padding:10px 12px;border:1px solid var(--border);}
.hist-item .h-date{font-size:10.5px;color:var(--text-faint);font-weight:700;}
.hist-item .h-text{font-size:12.5px;margin-top:3px;}

.attach-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px;}
.attach-item{border:1px dashed var(--border);border-radius:10px;padding:14px 10px;text-align:center;background:var(--bg);}
.attach-item svg{width:22px;height:22px;color:var(--blue);margin-bottom:6px;}
.attach-item .a-name{font-size:11px;font-weight:700;word-break:break-word;}
.attach-item .a-type{font-size:9.5px;color:var(--text-faint);margin-top:2px;}
.dropzone{
  border:2px dashed #c7d5ec;border-radius:12px;padding:22px;text-align:center;color:var(--text-muted);
  font-size:12.5px;font-weight:600;background:var(--bg);
}
.dropzone svg{width:26px;height:26px;color:var(--blue);margin-bottom:8px;}

.stage-picker{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;}
.stage-picker-block.is-new{background:var(--sky-tint);border:1px solid var(--sky);border-radius:var(--radius-md);padding:14px 16px;}
.stage-picker-block.is-new label{color:var(--sky-deep);font-size:12.5px;}
.stage-picker-block.is-new .stage-picker{margin-top:10px;}
.stage-chip{
  font-size:11px;font-weight:700;padding:6px 11px;border-radius:20px;border:1px solid var(--border);
  background:var(--bg);color:var(--text-muted);
}
.stage-chip.active{background:var(--blue);border-color:var(--blue);color:#fff;}

/* toast */
#toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--navy-900);color:#fff;padding:11px 20px;border-radius:11px;font-size:12.5px;font-weight:600;
  box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:all .25s;z-index:200;display:flex;align-items:center;gap:8px;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#toast svg{width:15px;height:15px;color:var(--success);flex-shrink:0;}

@media (max-width:1100px){
  .kpi-grid{grid-template-columns:repeat(2,1fr);}
  .grid-2{grid-template-columns:1fr;}
  .grid-3{grid-template-columns:1fr;}
  .renewal-grid{grid-template-columns:1fr;}
}

/* ===== LOGIN ===== */
#loginScreen{
  position:fixed;inset:0;z-index:500;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 20% 20%, #10163F 0%, var(--navy-900) 55%, #000114 100%);
  overflow:hidden;
}
#loginScreen::before{
  content:'';position:absolute;inset:0;
  background-image:radial-gradient(circle, rgba(241,169,160,.08) 1px, transparent 1px);
  background-size:26px 26px;opacity:.5;
}
#loginScreen::after{
  content:'';position:absolute;width:520px;height:520px;border-radius:50%;
  background:radial-gradient(circle, rgba(203,32,21,.18), transparent 70%);
  top:-160px;right:-160px;pointer-events:none;
}
.login-card{
  position:relative;width:100%;max-width:380px;background:var(--surface);border-radius:20px;
  box-shadow:0 24px 60px rgba(0,0,0,.35);padding:34px 32px 26px;
  animation:loginIn .55s var(--ease);
  transition:background .25s, box-shadow .25s;
}
.login-card.booting{background:transparent;box-shadow:none;padding:0;animation:none;}
.boot-loader{display:flex;flex-direction:column;align-items:center;gap:22px;padding:40px 0;}
.boot-loader img{height:26px;width:auto;filter:brightness(0) invert(1);opacity:.95;}
.boot-spinner{width:26px;height:26px;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:bootSpin .8s linear infinite;}
@keyframes bootSpin{ to{transform:rotate(360deg);} }
@keyframes loginIn{ from{opacity:0; transform:translateY(18px) scale(.98);} to{opacity:1; transform:translateY(0) scale(1);} }
.login-brand{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:24px;}
.login-brand .lb-logo{height:34px;width:auto;}
.login-brand .lb-t2{font-size:11.5px;color:var(--text-muted);font-weight:600;}
.login-brand .lb-tagline{font-size:10px;color:var(--text-faint);font-weight:700;letter-spacing:.5px;text-transform:uppercase;margin-top:2px;}
.login-field{margin-bottom:13px;}
.login-field label{font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.3px;display:block;margin-bottom:5px;}
.login-field input{
  width:100%;border:1px solid var(--border);border-radius:10px;padding:11px 13px;font-size:13.5px;
  outline:none;background:var(--bg);color:var(--text);transition:border-color .15s, box-shadow .15s;
}
.login-field input:focus{border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px rgba(185,217,235,.4);}
.login-error{
  background:var(--danger-light);color:var(--danger);font-size:12px;font-weight:700;padding:9px 12px;
  border-radius:9px;margin-bottom:13px;display:none;
}
.login-error.show{display:block;animation:shake .35s;}
@keyframes shake{ 10%,90%{transform:translateX(-1px);} 20%,80%{transform:translateX(2px);} 30%,50%,70%{transform:translateX(-4px);} 40%,60%{transform:translateX(4px);} }
.login-btn{
  width:100%;padding:12px;border-radius:10px;background:var(--blue);color:#fff;border:none;
  font-size:13.5px;font-weight:800;box-shadow:0 4px 14px rgba(0,4,45,.35);margin-top:6px;
  transition:transform .12s, background .15s;
}
.login-btn:hover{background:var(--blue-600);}
.link-btn{background:none;border:none;color:var(--blue);font-size:12px;font-weight:700;cursor:pointer;padding:4px;}
.link-btn:hover{text-decoration:underline;}
.login-btn:active{transform:scale(.98);}
.login-footer{
  margin-top:20px;padding-top:16px;border-top:1px solid var(--border);
  display:flex;flex-direction:column;align-items:center;gap:6px;
}
.login-footer img{height:14px;width:auto;opacity:.85;}
.login-footer .lf-text{font-size:10px;color:var(--text-faint);font-weight:600;letter-spacing:.2px;}

/* ===== ADMIN ===== */
.admin-tabs{display:flex;gap:4px;margin-bottom:16px;background:var(--surface-alt);border:1px solid var(--border);border-radius:11px;padding:4px;width:fit-content;}
.admin-tab-btn{padding:8px 16px;font-size:12.5px;font-weight:700;border-radius:8px;background:transparent;border:none;color:var(--text-muted);transition:background .15s,color .15s;}
.admin-tab-btn.active{background:var(--surface);color:var(--navy);box-shadow:var(--shadow-sm);}
.sub-pill{font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:20px;white-space:nowrap;}
.sub-pill.ok{background:var(--success-light);color:var(--success);}
.sub-pill.warn{background:var(--warning-light);color:#b5750a;}
.sub-pill.expired{background:var(--danger-light);color:var(--danger);}
.sub-pill.suspended{background:#EAECEF;color:#475467;}
.billing-row{border:1px solid var(--border);border-radius:var(--radius-md);padding:14px 16px;background:var(--surface);}
.billing-row-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;}
.billing-row-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center;}
.billing-row-actions input{flex:1;min-width:200px;border:1px solid var(--border);border-radius:9px;padding:8px 11px;font-size:12.5px;background:var(--bg);outline:none;}
.billing-row-actions input:focus{border-color:var(--blue);}
.billing-history{margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);font-size:11px;color:var(--text-faint);display:flex;flex-direction:column;gap:3px;}
.insurer-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;}
.insurer-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:16px;box-shadow:var(--shadow-sm);transition:box-shadow .2s,transform .15s;}
.insurer-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);}
.insurer-card-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.insurer-icon{width:38px;height:38px;border-radius:10px;background:var(--sky-tint);color:var(--sky-deep);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex-shrink:0;}
.insurer-icon img{filter:grayscale(100%);opacity:.7;transition:filter .25s var(--ease), opacity .25s var(--ease);}
.insurer-card:hover .insurer-icon img{filter:grayscale(0%);opacity:1;}
.insurer-name{font-size:13.5px;font-weight:800;color:var(--text);}
.insurer-link{font-size:11px;color:var(--blue);font-weight:700;}
.insurer-row{font-size:11.5px;color:var(--text-muted);margin-top:4px;line-height:1.4;}
.quick-access-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-top:10px;}
.quick-access-card{
  display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:16px 10px;
  border:1px solid var(--border);border-radius:var(--radius-md);text-decoration:none;color:var(--text);
  transition:box-shadow .2s, transform .15s, border-color .2s;
}
.quick-access-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);border-color:var(--qa-color, var(--blue));}
.quick-access-card .qa-icon{
  width:38px;height:38px;border-radius:10px;background:color-mix(in srgb, var(--qa-color, var(--blue)) 15%, white);
  color:var(--qa-color, var(--blue));display:flex;align-items:center;justify-content:center;
}
.quick-access-card .qa-icon svg{width:18px;height:18px;}
.quick-access-card .qa-name{font-size:12px;font-weight:700;}
.announcement-item{border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 10px;}
.announcement-item .ann-title{font-size:12px;font-weight:800;color:var(--text);}
.announcement-item .ann-msg{font-size:11px;color:var(--text-muted);margin-top:2px;line-height:1.4;}
.announcement-item .ann-meta{font-size:9.5px;color:var(--text-faint);margin-top:4px;}
.proposal-row{
  display:flex;align-items:center;gap:16px;padding:14px 16px;border:1px solid var(--border);border-radius:var(--radius-md);
  background:var(--surface);cursor:pointer;transition:box-shadow .2s, transform .15s;
}
.proposal-row:hover{box-shadow:var(--shadow-md);transform:translateY(-1px);}
.proposal-row-main{flex:1;min-width:0;}
.proposal-row-top{font-size:13px;color:var(--text);}
.proposal-row-sub{font-size:11.5px;color:var(--text-muted);margin-top:3px;}
.proposal-row-dates{font-size:10.5px;color:var(--text-faint);text-align:right;flex-shrink:0;line-height:1.6;}
.static-val{font-size:13px;font-weight:600;color:var(--text);padding:8px 0 2px;}
.attachment-list{display:flex;flex-wrap:wrap;gap:8px;}
.attachment-chip{
  display:inline-flex;align-items:center;gap:6px;background:var(--sky-tint);color:var(--sky-deep);
  border-radius:8px;padding:6px 10px;font-size:11.5px;font-weight:700;text-decoration:none;
}
.attachment-chip svg{width:13px;height:13px;}
.attachment-chip button{background:none;border:none;color:inherit;display:flex;align-items:center;padding:0;margin-left:2px;}
.attachment-chip button svg{width:10px;height:10px;}
.history-list{display:flex;flex-direction:column;gap:8px;max-height:180px;overflow-y:auto;}
.history-item{font-size:11.5px;color:var(--text-muted);display:flex;gap:8px;border-left:2px solid var(--border);padding-left:10px;}
.history-item .hi-date{font-weight:700;color:var(--text-faint);white-space:nowrap;}
.proposal-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px;padding-top:16px;border-top:1px solid var(--border);}
.welcome-banner{margin-bottom:18px;}
.welcome-greeting{font-size:26px;font-weight:800;font-family:'Poppins';color:var(--text);}
.welcome-sub{font-size:13px;color:var(--text-muted);margin-top:4px;}
.notification-item{border:1px solid var(--border);border-radius:var(--radius-sm);padding:7px 10px;cursor:pointer;transition:background .15s;}
.notification-item:hover{background:var(--bg);}
.notification-item.unread{border-left:3px solid var(--blue);background:var(--sky-tint);}
.notification-item .ann-title{font-size:11.5px;font-weight:800;color:var(--text);}
.notification-item .ann-msg{font-size:10.5px;color:var(--text-muted);margin-top:2px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;}
.notification-item .ann-meta{font-size:9.5px;color:var(--text-faint);margin-top:3px;}
.admin-table{width:100%;border-collapse:collapse;background:var(--surface);border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-sm);border:1px solid var(--border);}
.admin-table th{
  text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--text-muted);
  background:var(--bg);padding:11px 14px;font-weight:800;border-bottom:1px solid var(--border);
}
.admin-table td{padding:12px 14px;font-size:12.5px;border-bottom:1px solid var(--border);vertical-align:middle;}
.admin-table tr:last-child td{border-bottom:none;}
.role-badge{font-size:10px;font-weight:800;padding:3px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:.3px;}
.role-admin{background:var(--sky-tint);color:var(--sky-deep);}
.role-gestor{background:#EAF6EE;color:#1D8A4C;}
.role-corretor{background:var(--blue-light);color:var(--blue);}
.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;}
.ap-icon-strip{display:inline-flex;align-items:center;gap:8px;vertical-align:middle;}
.ap-status-dot{width:11px;height:11px;border-radius:50%;display:inline-block;flex-shrink:0;}
.ap-status-dot.vigente{background:var(--success);}
.ap-status-dot.cancelada{background:var(--danger);}
.ap-status-dot.suspensa{background:var(--warning);}
.ap-icon{width:17px;height:17px;display:inline-flex;flex-shrink:0;}
.ap-icon.on-sinistro{color:var(--danger);}
.ap-icon.on-assist{color:var(--blue);}
.ap-icon.on-endosso{color:var(--blue);}
.ap-icon.off{color:var(--text-faint);opacity:.4;}
.status-active{background:var(--success);}
.status-inactive{background:var(--text-faint);}
.admin-actions{display:flex;gap:6px;}

/* ===== SUBSCRIPTION BANNER ===== */
.sub-banner{
  display:flex;align-items:center;gap:10px;padding:10px 22px;font-size:12.5px;font-weight:600;
  animation:bannerIn .3s var(--ease);
}
@keyframes bannerIn{ from{opacity:0; transform:translateY(-8px);} to{opacity:1; transform:translateY(0);} }
.sub-banner svg{width:16px;height:16px;flex-shrink:0;}
.sub-banner span a{color:inherit;text-decoration:underline;cursor:pointer;font-weight:800;}
.sub-banner.warn{background:var(--warning-light);color:#8a5a06;}
.sub-banner.expired{background:var(--danger-light);color:var(--danger);}
.sub-banner-close{margin-left:auto;background:none;border:none;color:inherit;opacity:.6;width:20px;height:20px;flex-shrink:0;}
.sub-banner-close svg{width:12px;height:12px;}
.sub-banner-close:hover{opacity:1;}

/* ===== IMPORT/EXPORT TOOLBAR ===== */
.data-tools{display:flex;gap:6px;}

.import-option{
  display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--border);border-radius:var(--radius-md);
  cursor:pointer;transition:border-color .15s, background .15s, transform .1s;margin-bottom:10px;
}
.import-option:hover{border-color:var(--blue);background:var(--sky-tint);transform:translateY(-1px);}
.import-option .io-icon{
  width:38px;height:38px;border-radius:10px;background:var(--sky-tint);color:var(--sky-deep);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.import-option .io-icon svg{width:18px;height:18px;}
.import-option .io-title{font-size:13px;font-weight:800;color:var(--text);}
.import-option .io-sub{font-size:11.5px;color:var(--text-muted);margin-top:2px;}
/* =========================================================
   MICRO-ANIMAÇÕES GERAIS
   ========================================================= */
.view.active{animation:viewIn .28s var(--ease);}
@keyframes viewIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

.card, .task-item, .agenda-item, .renewal-card, .kpi-card{ animation:itemIn .32s var(--ease) both; }
.kanban-cards .card:nth-child(1){animation-delay:.02s;} .kanban-cards .card:nth-child(2){animation-delay:.05s;}
.kanban-cards .card:nth-child(3){animation-delay:.08s;} .kanban-cards .card:nth-child(4){animation-delay:.11s;}
.kanban-cards .card:nth-child(5){animation-delay:.14s;} .kanban-cards .card:nth-child(n+6){animation-delay:.16s;}
.task-col .task-item:nth-child(1){animation-delay:.02s;} .task-col .task-item:nth-child(2){animation-delay:.06s;}
.task-col .task-item:nth-child(3){animation-delay:.1s;} .task-col .task-item:nth-child(n+4){animation-delay:.13s;}
.kpi-grid .kpi-card:nth-child(1){animation-delay:0s;} .kpi-grid .kpi-card:nth-child(2){animation-delay:.05s;}
.kpi-grid .kpi-card:nth-child(3){animation-delay:.1s;} .kpi-grid .kpi-card:nth-child(4){animation-delay:.15s;}
@keyframes itemIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

.kanban-col{transition:background .15s;}
.kpi-card, .panel, .renewal-card, .import-option{transition:box-shadow .2s var(--ease), transform .2s var(--ease);}
.kpi-card:hover{box-shadow:var(--shadow-md); transform:translateY(-2px);}
.kanban-col{transition:box-shadow .2s var(--ease);}
.kanban-col:hover{box-shadow:inset 0 0 0 1px rgba(0,4,45,.06);}
.task-item, .agenda-item{transition:box-shadow .2s var(--ease), transform .15s var(--ease), border-color .15s;}
.task-item:hover, .agenda-item:hover{box-shadow:var(--shadow-md); transform:translateY(-1px); border-color:#c9d5e8;}
.admin-table tr{transition:background .15s;}
.admin-table tbody tr:hover{background:var(--sky-tint);}
.stage-chip{transition:background .15s, color .15s, border-color .15s, transform .12s;}
.stage-chip:hover{border-color:var(--blue); color:var(--blue); transform:translateY(-1px);}
.stage-chip.active:hover{color:#fff; border-color:var(--blue);}
.seg-btn:hover{color:var(--navy);}
.sidebar-footer:hover .who{color:var(--sky);}
.group-filter{transition:box-shadow .15s, border-color .15s;}
.group-filter:hover{border-color:var(--blue);}
.billing-row{transition:box-shadow .2s var(--ease), border-color .2s;}
.billing-row:hover{box-shadow:var(--shadow-sm); border-color:#c9d5e8;}
.renewal-card:hover{box-shadow:var(--shadow-md); transform:translateY(-2px); border-color:#c9d5e8;}
.card-owner, .avatar-sm{transition:transform .15s;}
.card:hover .card-owner{transform:scale(1.08);}
.wpp-chip{transition:transform .12s, background .15s;}
.wpp-chip:hover{transform:translateY(-1px);}
.sub-pill{transition:transform .12s;}
.role-badge{transition:transform .12s;}
.admin-table tbody tr:hover .role-badge{transform:scale(1.04);}
.nav-item{transition:background .18s, color .18s;}
.nav-badge{animation:badgePop .3s var(--ease);}
@keyframes badgePop{ from{transform:scale(0);} to{transform:scale(1);} }
.btn, .icon-btn, .mtab-btn, .stage-chip, .seg-btn{transition:transform .12s, background .15s, border-color .15s, color .15s, box-shadow .15s;}
.btn:active, .icon-btn:active{transform:scale(.96);}
#toast{transition:opacity .3s var(--ease), transform .3s var(--ease);}

/* =========================================================
   BARRA DE NAVEGAÇÃO MOBILE (oculta no desktop)
   ========================================================= */
.mobile-tabbar{display:none;}
.more-sheet-item{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 12px;border-radius:12px;
  background:none;border:none;font-size:13.5px;font-weight:700;color:var(--text);
}
.more-sheet-item:hover{background:var(--bg);}
.more-sheet-item .mtab-icon svg{width:18px;height:18px;color:var(--text-muted);}

  .data-tools{order:5;width:100%;justify-content:flex-end;}

  .filterbar.mobile-open{display:flex !important;}

  .kpi-grid{grid-template-columns:1fr 1fr;gap:10px;}
  .grid-2, .grid-3{grid-template-columns:1fr;}
  .renewal-grid{grid-template-columns:1fr;}
  .field-grid{grid-template-columns:1fr;}
  .page-scroll{padding:14px;}
  .kanban-wrap{padding:12px 14px;}
  .kanban-col{min-width:82vw;max-width:82vw;scroll-snap-align:start;}
  .kanban-wrap{scroll-snap-type:x mandatory;}
  .task-cols{padding:12px 14px;}
  .task-col{min-width:84vw;max-width:84vw;scroll-snap-align:start;}
  .task-cols{scroll-snap-type:x mandatory;}
  .agenda-body, .renewal-groups{padding:14px;}
  .renewal-group-title{justify-content:center;text-align:center;}
  .filter-date-group{width:100%;flex-wrap:wrap;}
  .filter-date-group select, .filter-date-group input[type=date]{flex:1;min-width:110px;}

  /* Modais viram bottom sheets, como em apps bancários */
  .modal-overlay{align-items:flex-end;padding:0;}
  .modal{
    position:relative;
    border-radius:22px 22px 0 0;max-height:92vh;width:100%;max-width:100% !important;
    animation:sheetUp .3s var(--ease);
    padding-bottom:env(safe-area-inset-bottom);
  }
  @keyframes sheetUp{ from{opacity:0; transform:translateY(100%);} to{opacity:1; transform:translateY(0);} }
  .modal::before{
    content:'';position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:2;
    width:36px;height:4px;border-radius:4px;background:rgba(255,255,255,.4);
  }
  .modal-head{padding-top:20px;border-radius:22px 22px 0 0;}

  /* Tabelas de admin viram cartões empilhados */
  .admin-table thead{display:none;}
  .admin-table, .admin-table tbody, .admin-table tr, .admin-table td{display:block;width:100%;}
  .admin-table tr{margin-bottom:12px;border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden;}
  .admin-table td{border-bottom:1px solid var(--border);padding:9px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:right;}
  .admin-table td::before{content:attr(data-label);font-size:10.5px;font-weight:800;color:var(--text-muted);text-transform:uppercase;letter-spacing:.3px;text-align:left;}
  .admin-table td:last-child{border-bottom:none;}
  .admin-tabs{width:100%;overflow-x:auto;}

  .login-card{max-width:100%;margin:0 16px;padding:28px 22px 22px;}


  .billing-row-actions{flex-direction:column;align-items:stretch;}
  .billing-row-actions input{min-width:0;}

  .global-footer-bar{display:none !important;}
  #adminMiniDash{display:none !important;}

  .mobile-tabbar{
    display:flex;position:fixed;left:0;right:0;bottom:0;z-index:150;
    background:var(--surface);border-top:1px solid var(--border);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));
    box-shadow:0 -4px 16px rgba(0,4,45,.08);
  }
  .mtab-btn{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
    background:none;border:none;padding:6px 2px;border-radius:12px;color:var(--text-faint);
  }
  .mtab-btn .mtab-icon svg{width:20px;height:20px;}
  .mtab-btn .mtab-label{font-size:9.5px;font-weight:700;}
  .mtab-btn.active{color:var(--blue);}
  .mtab-btn.active .mtab-icon{transform:translateY(-1px);}
  .mtab-btn:active{transform:scale(.94);}
}
@media (max-width: 420px){
  .kpi-grid{grid-template-columns:1fr;}
}
/* =========================================================

.fg input:focus, .fg select:focus{ border-color:var(--blue); background:#fff; }
.kanban-board{ display:flex; gap:14px; overflow-x:auto; padding-bottom:10px; }
.kanban-col{ min-width:260px; max-width:260px; background:var(--surface-alt); border-radius:var(--radius-md); padding:10px; flex-shrink:0; }
.kanban-col-title{ font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.4px; color:var(--text-muted); padding:4px 6px 10px; display:flex; justify-content:space-between; }
.kanban-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px; margin-bottom:8px; cursor:pointer; box-shadow:var(--shadow-sm); }
.kanban-card:hover{ box-shadow:var(--shadow-md); }
.kanban-card .kc-name{ font-size:13px; font-weight:700; color:var(--text); }
.kanban-card .kc-sub{ font-size:11.5px; color:var(--text-muted); margin-top:3px; }
.table-simple{ width:100%; border-collapse:collapse; }
.table-simple th{ text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.4px; color:var(--text-faint); border-bottom:1px solid var(--border); padding:8px 10px; }
.table-simple td{ font-size:13px; padding:10px; border-bottom:1px solid var(--border); vertical-align:middle; }
.table-simple tr:hover td{ background:var(--surface-alt); cursor:pointer; }
.perm-row{ display:flex; align-items:center; justify-content:space-between; padding:8px 0; border-bottom:1px dashed var(--border); font-size:12.5px; }
.perm-row:last-child{ border-bottom:none; }
.toggle-switch{ position:relative; display:inline-block; width:38px; height:22px; flex-shrink:0; }
.toggle-switch input{ opacity:0; width:0; height:0; }
.toggle-slider{ position:absolute; cursor:pointer; inset:0; background:#CBD5E1; border-radius:22px; transition:.15s; }
.toggle-slider:before{ content:""; position:absolute; height:16px; width:16px; left:3px; bottom:3px; background:#fff; border-radius:50%; transition:.15s; }
.toggle-switch input:checked + .toggle-slider{ background:var(--success); }
.toggle-switch input:checked + .toggle-slider:before{ transform:translateX(16px); }
.page-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; flex-wrap:wrap; gap:10px; }
.page-title{ font-size:19px; font-weight:800; color:var(--navy); }
.view-wrap{ padding:22px 26px; overflow-y:auto; height:calc(100vh - 0px); }
.stat-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:14px; margin-bottom:22px; }
.stat-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:16px; box-shadow:var(--shadow-sm); }
.stat-card .sc-val{ font-size:24px; font-weight:800; color:var(--navy); }
.stat-card .sc-label{ font-size:11.5px; color:var(--text-muted); margin-top:2px; }
.modal{ background:var(--surface); border-radius:20px; max-width:640px; width:94%; max-height:88vh; overflow-y:auto; box-shadow:var(--shadow-lg); }
.modal-head{ display:flex; align-items:center; gap:12px; padding:18px 22px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--surface); z-index:2; }
.modal-body{ padding:20px 22px; }
.mh-avatar{ width:38px; height:38px; border-radius:50%; background:var(--navy); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; flex-shrink:0; }
.mh-info{ flex:1; min-width:0; }
.mh-name{ font-size:14.5px; font-weight:800; color:var(--text); }
.mh-sub{ font-size:11.5px; color:var(--text-muted); }
.modal-close{ background:var(--surface-alt); border:none; border-radius:8px; padding:7px; color:var(--text-muted); }
.email-preview{ background:var(--surface-alt); border:1px dashed var(--border); border-radius:var(--radius-md); padding:14px 16px; font-size:12.5px; color:var(--text); white-space:pre-wrap; line-height:1.6; margin-bottom:14px; }
.btn-primary{ background:var(--blue); color:#fff; border:none; border-radius:10px; padding:10px 18px; font-size:13px; font-weight:700; display:inline-flex; align-items:center; gap:7px; white-space:nowrap; }
.btn-primary:hover{ background:var(--blue-600); }
.btn-ghost{ background:var(--surface-alt); color:var(--text); border:1px solid var(--border); border-radius:10px; padding:10px 18px; font-size:13px; font-weight:700; display:inline-flex; align-items:center; gap:7px; white-space:nowrap; }
.btn-danger{ background:var(--danger-light); color:var(--danger); border:none; border-radius:10px; padding:9px 14px; font-size:12.5px; font-weight:700; display:inline-flex; align-items:center; gap:6px; white-space:nowrap; }
.btn-primary svg, .btn-ghost svg, .btn-danger svg, .wpp-btn svg{ width:15px; height:15px; flex-shrink:0; }
.modal-close svg{ width:16px; height:16px; }
.attachment-chip svg{ width:13px; height:13px; flex-shrink:0; }
.btn-row{ display:flex; gap:10px; flex-wrap:wrap; margin-top:18px; padding-top:16px; border-top:1px solid var(--border); }
.empty-state{ text-align:center; padding:50px 20px; color:var(--text-faint); }
.empty-state svg{ width:44px; height:44px; opacity:.4; margin-bottom:10px; }
.search-input{ border:1px solid var(--border); border-radius:10px; padding:9px 13px; font-size:13px; min-width:220px; background:var(--surface); outline:none; }
.search-input:focus{ border-color:var(--blue); }
</style>

   ========================================================= */
const SUPABASE_URL = "https://ucqmgvmnqcbbboryuevn.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_8mxIm8xrMLcIICWXGxtFSA_sancrabI";
const STORAGE_KEY = 'cdlunimed_portal_db_v1';

function supabaseHeaders(extra){
  return Object.assign({ apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` }, extra||{});
}
window.storage = {
  async get(key){
    const url = `${SUPABASE_URL}/rest/v1/portal_storage?key=eq.${encodeURIComponent(key)}&select=value`;
    const res = await fetch(url, { headers: supabaseHeaders() });
    if(!res.ok) throw new Error('Supabase get failed: '+res.status);
    const rows = await res.json();
    if(!rows.length) throw new Error('not found');
    return { key, value: JSON.stringify(rows[0].value) };
  },
  async set(key, value){
    const url = `${SUPABASE_URL}/rest/v1/portal_storage`;
    const res = await fetch(url, {
      method: 'POST',
      headers: supabaseHeaders({ 'Content-Type':'application/json', Prefer:'resolution=merge-duplicates,return=minimal' }),
      body: JSON.stringify({ key, value: JSON.parse(value), updated_at: new Date().toISOString() })
    });
    if(!res.ok) throw new Error('Supabase set failed: '+res.status);
    return { key, value };
  },
  async delete(key){
    const url = `${SUPABASE_URL}/rest/v1/portal_storage?key=eq.${encodeURIComponent(key)}`;
    await fetch(url, { method:'DELETE', headers: supabaseHeaders() });
    return { key, deleted:true };
  },
  async list(prefix){
    let url = `${SUPABASE_URL}/rest/v1/portal_storage?select=key`;
    if(prefix) url += `&key=like.${encodeURIComponent(prefix)}*`;
    const res = await fetch(url, { headers: supabaseHeaders() });
    if(!res.ok) throw new Error('Supabase list failed: '+res.status);
    const rows = await res.json();
    return { keys: rows.map(r=>r.key) };
  }
};

/* =========================================================
   UTILITÁRIOS
   ========================================================= */
function uid(prefix){ return prefix+'_'+Math.random().toString(36).slice(2,9); }
function todayISO(offset=0){ const d=new Date(); d.setDate(d.getDate()+offset); return d.toISOString().slice(0,10); }
function nowISO(){ return new Date().toISOString(); }
function fmtDate(iso){ if(!iso) return '—'; const [y,m,d]=iso.split('-'); return `${d}/${m}/${y}`; }
function fmtDateTime(iso){ if(!iso) return '—'; const d=new Date(iso); return d.toLocaleDateString('pt-BR')+' às '+d.toLocaleTimeString('pt-BR').slice(0,5); }
function initials(name){ return (name||'?').split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase(); }
function onlyDigits(v){ return (v||'').replace(/\D/g,''); }
function maskCnpj(v){
  v = onlyDigits(v).slice(0,14);
  v = v.replace(/^(\d{2})(\d)/,"$1.$2").replace(/^(\d{2})\.(\d{3})(\d)/,"$1.$2.$3").replace(/\.(\d{3})(\d)/,".$1/$2").replace(/(\d{4})(\d)/,"$1-$2");
  return v;
}
function maskPhone(v){
  v = onlyDigits(v).slice(0,11);
  v = v.replace(/^(\d{2})(\d)/,"($1) $2").replace(/(\d{5})(\d)/,"$1-$2");
  return v;
}
function maskCpf(v){
  v = onlyDigits(v).slice(0,11);
  v = v.replace(/^(\d{3})(\d)/,"$1.$2").replace(/^(\d{3})\.(\d{3})(\d)/,"$1.$2.$3").replace(/\.(\d{3})(\d{1,2})$/,".$1-$2");
  return v;
}
function toast(msg){
  const t=document.getElementById('toast');
  t.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>${msg}`;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer=setTimeout(()=>t.classList.remove('show'), 2400);
}
function closeModal(){ document.getElementById('modalOverlay').classList.remove('active'); }
function openModalHTML(html){
  document.getElementById('modalOverlay').innerHTML = html;
  document.getElementById('modalOverlay').classList.add('active');
}
document.addEventListener('keydown',(e)=>{
  if(e.key==='Escape'){
    const overlay=document.getElementById('modalOverlay');
    if(overlay.classList.contains('active')) closeModal();
  }
});

/* =========================================================
   BASE DE DADOS (em memória, persistida via window.storage)
   ========================================================= */
let DB = { users:[], leads:[], clients:[], companies:[] };
let CURRENT_USER = null;
let CURRENT_VIEW = 'inicio';

async function persist(){
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify(DB));
  }catch(e){
    console.warn('Não foi possível salvar no Supabase agora.', e);
    toast('⚠️ Não foi possível salvar agora — verifique sua conexão.');
  }
}
async function loadDB(){
  try{
    const r = await window.storage.get(STORAGE_KEY);
    DB = JSON.parse(r.value);
  }catch(e){
    DB = seedDB();
    try{ await persist(); }catch(e2){ console.warn('Não foi possível salvar a base inicial.', e2); }
  }
  // garante que módulos novos existam mesmo em bases antigas
  DB.users = DB.users||[]; DB.leads = DB.leads||[]; DB.clients = DB.clients||[]; DB.companies = DB.companies||[];
}

function seedDB(){
  const adminId = uid('usr');
  return {

/* =========================================================
   PERMISSÕES (papel 'admin' vê tudo; 'atendente' segue o objeto permissoes)
   ========================================================= */
function isAdmin(u){ u=u||CURRENT_USER; return !!(u && u.papel==='admin'); }
const MODULOS = ['leads','clientes','empresas','usuarios'];
function defaultPermissoes(){
  const o={};
  MODULOS.forEach(m=>{ o[m] = { ver:true, criar:true, editar:true, excluir:false }; });
  o.usuarios = { ver:false, criar:false, editar:false, excluir:false };
  return o;
}
function hasPerm(modulo, acao){
  if(isAdmin()) return true;
  if(!CURRENT_USER || !CURRENT_USER.permissoes) return false;
  const p = CURRENT_USER.permissoes[modulo];
  return !!(p && p[acao]);
}

  `;
  document.getElementById('li_email').focus();

async function doLogin(){
  const email = document.getElementById('li_email').value.trim().toLowerCase();
  const pass = document.getElementById('li_pass').value;
  const u = DB.users.find(x=>x.email.toLowerCase()===email && x.senha===pass);
  const err = document.getElementById('loginError');
  if(!u){ err.textContent='E-mail ou senha inválidos.'; err.classList.add('show'); return; }
  if(!u.ativo){ err.textContent='Este usuário está desativado. Fale com o administrador.'; err.classList.add('show'); return; }
  err.classList.remove('show');
  CURRENT_USER = u;
  localStorage.setItem(SESSION_KEY, u.id);
  enterApp();
}
function logout(){
  CURRENT_USER = null;
  localStorage.removeItem(SESSION_KEY);
  document.getElementById('app').style.display='none';
  renderLogin();
}
function checkSession(){
  const id = localStorage.getItem(SESSION_KEY);
  if(!id) return false;
  const u = DB.users.find(x=>x.id===id && x.ativo);
  if(!u) return false;
  CURRENT_USER = u;
  return true;
}

function getNavItems(){
  const items = [{id:'inicio', label:'Início', icon:ICONS.home}];
  if(hasPerm('leads','ver')) items.push({id:'leads', label:'Leads', icon:ICONS.kanban});
  if(hasPerm('clientes','ver')) items.push({id:'clientes', label:'Clientes', icon:ICONS.clients});
  if(hasPerm('empresas','ver')) items.push({id:'empresas', label:'Empresas Filiadas', icon:ICONS.building});
  if(isAdmin()) items.push({id:'usuarios', label:'Usuários & Permissões', icon:ICONS.admin});
  return items;
}
function renderNav(){
  const nav = document.getElementById('nav');
  nav.innerHTML = getNavItems().map(item=>
    `<button class="nav-item ${CURRENT_VIEW===item.id?'active':''}" onclick="switchView('${item.id}')">${item.icon}<span>${item.label}</span></button>`
  ).join('');
  renderMobileTabbar();
}
function renderMobileTabbar(){
  const bar = document.getElementById('mobileTabbar');
  if(!bar) return;
  bar.innerHTML = getNavItems().map(item=>
    `<button class="mtab-btn ${CURRENT_VIEW===item.id?'active':''}" onclick="switchView('${item.id}')"><span class="mtab-icon">${item.icon}</span><span class="mtab-label">${item.label.split(' ')[0]}</span></button>`
  ).join('');
}
function switchView(id){
  CURRENT_VIEW = id;
  renderNav();
  renderTopbar();
  const views = document.getElementById('views');
  if(id==='inicio') views.innerHTML = viewInicio();
  else if(id==='leads') views.innerHTML = viewLeads();
  else if(id==='clientes') views.innerHTML = viewClientes();
  else if(id==='empresas') views.innerHTML = viewEmpresas();
  else if(id==='usuarios') views.innerHTML = viewUsuarios();
}

async function saveLead(id){
  const data = {
    empresa: document.getElementById('ld_empresa').value.trim(),
    cnpj: onlyDigits(document.getElementById('ld_cnpj').value),
    nomeContato: document.getElementById('ld_nome').value.trim(),
    celular: document.getElementById('ld_celular').value.trim(),
    planoInteresse: document.getElementById('ld_plano').value.trim(),
    etapa: document.getElementById('ld_etapa').value,
    obs: document.getElementById('ld_obs').value.trim(),
  };
  if(!data.empresa){ toast('Informe ao menos o nome da empresa.'); return; }
  if(id){
    Object.assign(DB.leads.find(l=>l.id===id), data);
  }else{
    DB.leads.push({ id:uid('lead'), origem:'manual', criadoEm:nowISO(), ...data });
  }
  await persist();
  closeModal();
  switchView('leads');
  toast('Lead salvo.');
}
async function deleteLead(id){
  if(!confirm('Excluir este lead?')) return;
  DB.leads = DB.leads.filter(l=>l.id!==id);
  await persist();
  closeModal();
  switchView('leads');
}
async function convertLeadToClient(id){
  const lead = DB.leads.find(l=>l.id===id);
  if(!lead) return;
  const client = {
    id: uid('cli'),
    status: 'ativo',
    leadOrigemId: lead.id,
    titular: { nome:lead.nomeContato||lead.empresa, cpf:'', dataNascimento:'', celular:lead.celular, email:'', cargo:'', razaoSocial:lead.empresa, cnpj:lead.cnpj },
    dependentes: [],
    planoEscolhido: lead.planoInteresse||'',
    anexos: [],
    historico: [{ data:nowISO(), texto:'Cliente criado a partir de um lead.' }],
    emailAdministradoraEnviadoEm: null,
    criadoEm: nowISO(),
  };
  DB.clients.push(client);
  lead.etapa = 'convertido';
  await persist();
  closeModal();
  toast(`${lead.empresa} agora é cliente.`);
  switchView('clientes');
  openClientModal(client.id);
}

let CLIENT_FILTER = { q:'', status:'' };
function viewClientes(){
  const canCriar = hasPerm('clientes','criar');
  const list = DB.clients.filter(c=>{
    if(CLIENT_FILTER.status && c.status!==CLIENT_FILTER.status) return false;
    if(CLIENT_FILTER.q){
      const q = CLIENT_FILTER.q.toLowerCase();
      const t = c.titular||{};
      if(!((t.nome||'').toLowerCase().includes(q) || (t.razaoSocial||'').toLowerCase().includes(q) || (t.cnpj||'').includes(q))) return false;
    }
    return true;
  });
  return `
  <div class="view-wrap">
    <div class="page-head">
      <div class="page-title">Clientes</div>
      ${canCriar?`<button class="btn-primary" onclick="openClientModal(null,true)">${ICONS.plus} Novo cliente</button>`:''}

    <div style="display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;">
      <input class="search-input" placeholder="Buscar por nome, empresa ou CNPJ..." value="${CLIENT_FILTER.q}" oninput="CLIENT_FILTER.q=this.value; switchView('clientes')"/>
      <select class="search-input" onchange="CLIENT_FILTER.status=this.value; switchView('clientes')">
        <option value="">Todos os status</option>

        <option value="inativo" ${CLIENT_FILTER.status==='inativo'?'selected':''}>Inativos</option>
      </select>

let ACTIVE_CLIENT_ID = null;
let ACTIVE_PERSON_TAB = 'titular';
function openClientModal(id, isNew){
  ACTIVE_CLIENT_ID = id;
  ACTIVE_PERSON_TAB = 'titular';
  if(isNew){
    const c = { id:uid('cli'), status:'ativo', titular:{nome:'',cpf:'',dataNascimento:'',celular:'',email:'',cargo:'',razaoSocial:'',cnpj:''}, dependentes:[], planoEscolhido:'', anexos:[], historico:[{data:nowISO(),texto:'Cliente cadastrado manualmente.'}], emailAdministradoraEnviadoEm:null, criadoEm:nowISO() };
    DB.clients.push(c);
    ACTIVE_CLIENT_ID = c.id;
  }
  renderClientModal();
  document.getElementById('modalOverlay').classList.add('active');
}
function switchPersonTab(tab){ ACTIVE_PERSON_TAB = tab; renderClientModal(); }

async function updateTitular(){
  const c = DB.clients.find(x=>x.id===ACTIVE_CLIENT_ID);
  c.titular.razaoSocial = document.getElementById('cl_razao').value.trim();
  c.titular.cnpj = onlyDigits(document.getElementById('cl_cnpj').value);
  c.titular.nome = document.getElementById('cl_nome').value.trim();
  c.titular.cpf = onlyDigits(document.getElementById('cl_cpf').value);
  c.titular.dataNascimento = document.getElementById('cl_nasc').value;
  c.titular.celular = document.getElementById('cl_celular').value.trim();
  c.titular.email = document.getElementById('cl_email').value.trim();
  await persist();
}
async function updatePlano(){
  const c = DB.clients.find(x=>x.id===ACTIVE_CLIENT_ID);
  c.planoEscolhido = document.getElementById('cl_plano').value.trim();
  await persist();
}
async function toggleClientStatus(){
  const c = DB.clients.find(x=>x.id===ACTIVE_CLIENT_ID);
  c.status = c.status==='ativo' ? 'inativo' : 'ativo';
  c.historico.push({ data:nowISO(), texto:`Status alterado para ${c.status==='ativo'?'Ativo':'Inativo'}.` });
  await persist();
  renderClientModal();
  toast(`Cliente marcado como ${c.status==='ativo'?'ativo':'inativo'}.`);
}
async function addDependente(){
  const c = DB.clients.find(x=>x.id===ACTIVE_CLIENT_ID);
  c.dependentes.push({ id:uid('dep'), nome:'', cpf:'', dataNascimento:'', parentesco:'' });
  await persist();
  renderClientModal();
}
async function updateDependente(i, field, value){
  const c = DB.clients.find(x=>x.id===ACTIVE_CLIENT_ID);
  c.dependentes[i][field] = field==='cpf' ? onlyDigits(value) : value;
  await persist();
}
async function removeDependente(i){
  const c = DB.clients.find(x=>x.id===ACTIVE_CLIENT_ID);
  c.dependentes.splice(i,1);
  await persist();
  renderClientModal();
}
function handleAttachFile(event){
  const files = Array.from(event.target.files||[]);
  const c = DB.clients.find(x=>x.id===ACTIVE_CLIENT_ID);
  if(!c || !files.length) return;
  let pending = files.length;
  files.forEach(file=>{
    const reader = new FileReader();
    reader.onload = async ()=>{
      c.anexos.push({ id:uid('anx'), nome:file.name, dataUrl:reader.result, criadoEm:nowISO() });
      pending--;
      if(pending===0){ await persist(); renderClientModal(); toast('Anexo(s) adicionado(s).'); }
    };
    reader.readAsDataURL(file);
  });
  event.target.value = '';
}
async function removeAnexo(i){
  const c = DB.clients.find(x=>x.id===ACTIVE_CLIENT_ID);
  c.anexos.splice(i,1);
  await persist();
  renderClientModal();
}
async function deleteClient(){
  if(!confirm('Excluir este cliente definitivamente?')) return;
  DB.clients = DB.clients.filter(c=>c.id!==ACTIVE_CLIENT_ID);
  await persist();
  closeModal();
  switchView('clientes');
  toast('Cliente excluído.');
}

/* ---- Envio de e-mail para a administradora (mailto: com resumo da triagem) ---- */

  const c = DB.clients.find(x=>x.id===ACTIVE_CLIENT_ID);
  const t = c.titular;
  const depsTxt = c.dependentes.length
    ? c.dependentes.map((d,i)=>`  ${i+1}. ${d.nome||'(sem nome)'} — CPF ${maskCpf(d.cpf||'')||'—'} — Nasc. ${fmtDate(d.dataNascimento)} — ${d.parentesco||'—'}`).join('\n')
    : '  Nenhum dependente informado.';
  const anexosTxt = c.anexos.length
    ? c.anexos.map(a=>`  - ${a.nome}`).join('\n')
    : '  Nenhum anexo carregado no portal.';
  const subject = `Nova adesão — ${t.razaoSocial||t.nome} — CDL Mossoró x Unimed`;
  const body =
`Empresa/Razão social: ${t.razaoSocial||'—'}
CNPJ: ${maskCnpj(t.cnpj||'')||'—'}

Titular: ${t.nome||'—'}
CPF: ${maskCpf(t.cpf||'')||'—'}
Data de nascimento: ${fmtDate(t.dataNascimento)}
Celular: ${maskPhone(t.celular||'')||'—'}
E-mail: ${t.email||'—'}

Plano escolhido: ${c.planoEscolhido||'—'}

Dependentes:
${depsTxt}

Anexos (baixe do portal e anexe manualmente a este e-mail):
${anexosTxt}

--
Enviado pelo portal interno CDL Mossoró x Unimed.`;

  const mailto = `mailto:?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;

  openModalHTML(`
    <div class="modal modal-small">
      <div class="modal-head">
        <div class="mh-info"><div class="mh-name">Enviar e-mail para a administradora</div></div>
        <button class="modal-close" onclick="renderClientModal()">${ICONS.close}</button>
      </div>
      <div class="modal-body">
        <div class="fg" style="margin-bottom:12px;"><label>E-mail da administradora</label><input id="admin_email_to" placeholder="comercial@unimednatal.com.br"/></div>
        <div class="email-preview">${body.replace(/</g,'&lt;')}</div>
        ${c.anexos.length?`<p style="font-size:11.5px;color:var(--text-muted);margin-bottom:10px;">⚠️ O e-mail abre com o texto pronto, mas os ${c.anexos.length} anexo(s) precisam ser adicionados manualmente no seu programa de e-mail (baixe pela aba Anexos).</p>`:''}
        <div class="btn-row">
          <button class="btn-primary" onclick="confirmSendAdminEmail('${mailto}')">${ICONS.mail} Abrir e-mail pronto para enviar</button>
          <button class="btn-ghost" onclick="renderClientModal()">Voltar</button>
        </div>

async function confirmSendAdminEmail(mailtoBase){
  const to = document.getElementById('admin_email_to').value.trim();
  const finalMailto = to ? mailtoBase.replace('mailto:?', `mailto:${encodeURIComponent(to)}?`) : mailtoBase;
  window.location.href = finalMailto;
  const c = DB.clients.find(x=>x.id===ACTIVE_CLIENT_ID);
  c.emailAdministradoraEnviadoEm = nowISO();
  c.historico.push({ data:nowISO(), texto:'E-mail de adesão preparado e enviado para a administradora.' });
  await persist();
  renderClientModal();
  toast('E-mail preparado — confira seu programa de e-mail.');

async function saveEmpresa(id){

async function saveUser(id){
  const nome = document.getElementById('us_nome').value.trim();
  const email = document.getElementById('us_email').value.trim();
  const senhaField = document.getElementById('us_senha').value;
  const papel = document.getElementById('us_papel').value;
  const ativo = document.getElementById('us_ativo').checked;
  if(!nome || !email){ toast('Preencha nome e e-mail.'); return; }
  const permissoes = {};
  MODULOS.forEach(m=>{
    permissoes[m] = {
      ver: document.getElementById(`perm_${m}_ver`).checked,
      criar: document.getElementById(`perm_${m}_criar`).checked,
      editar: document.getElementById(`perm_${m}_editar`).checked,
      excluir: document.getElementById(`perm_${m}_excluir`).checked,
    };
  });
  if(id){
    const u = DB.users.find(x=>x.id===id);
    Object.assign(u, { nome, email, papel, ativo, permissoes });
    if(senhaField) u.senha = senhaField;
  }else{
    if(!senhaField){ toast('Defina uma senha para o novo usuário.'); return; }
    DB.users.push({ id:uid('usr'), nome, email, senha:senhaField, papel, ativo, permissoes, criadoEm:todayISO() });
  }
  await persist();
  closeModal();
  switchView('usuarios');
  toast('Usuário salvo.');
}
async function deleteUser(id){
  if(id===CURRENT_USER.id){ toast('Você não pode excluir seu próprio usuário.'); return; }
  if(!confirm('Excluir este usuário?')) return;
  DB.users = DB.users.filter(u=>u.id!==id);
  await persist();
  closeModal();
  switchView('usuarios');
}

/* =========================================================
   BOOT
   ========================================================= */
async function boot(){
  await loadDB();
  if(checkSession()){
    enterApp();
  }else{
    renderLogin();
  }
}
boot();
</script>
