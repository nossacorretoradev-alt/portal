<style>
:root{--navy:#00042D;--accent:#CB2015;--green:#12B76A;--muted:#64748B;--border:#E4E9EF;--bg:#F6F8FA}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:#1B2733}
.bar{background:#fff;border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;justify-content:center;gap:12px}
.bar img{height:26px}.bar span{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;border-left:1px solid var(--border);padding-left:12px}
.wrap{max-width:920px;margin:0 auto;padding:24px 16px 48px}
h1{font-family:Poppins,Arial,sans-serif;font-size:22px;margin:0 0 4px;color:var(--navy)}
.sub{color:var(--muted);font-size:13px;margin-bottom:18px}
.card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin-bottom:14px}
.titulo{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--accent);margin:22px 0 8px}
.resumo{display:flex;gap:18px;flex-wrap:wrap;font-size:13px}.resumo b{display:block;font-size:17px;color:var(--navy)}
.arq{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--border);font-size:13px}
.arq:first-child{border-top:0}
a.btn,button.btn{display:inline-block;border:0;border-radius:10px;padding:8px 14px;font-weight:600;font-size:12.5px;cursor:pointer;text-decoration:none;font-family:inherit}
.prim{background:var(--navy);color:#fff}.sec{background:#EEF2F6;color:var(--navy)}
.vida-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.vida-head small{color:var(--muted)}
.erro{text-align:center;padding:60px 20px;color:var(--muted)}
.rodape{text-align:center;font-size:11px;color:var(--muted);margin-top:26px}
</style>
</head>

<script>
const SUPABASE_URL = 'https://ucqmgvmnqcbbboryuevn.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_8mxIm8xrMLcIICWXGxtFSA_sancrabI';
const TOKEN = new URLSearchParams(location.search).get('t') || '';
let PACOTE = null;
const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
function linhaArquivo(a) {
  return `<div class="arq"><span>${esc(a.nome)}</span><a class="btn sec" href="${esc(a.url)}" target="_blank" rel="noopener">Abrir</a></div>`;
}
function render() {
  const p = PACOTE;
  const e = p.empresa || {};
  document.getElementById('app').innerHTML = `
    <h1>${esc(e.razaoSocial || 'Implantação')}</h1>
    <div class="sub">CNPJ ${esc(e.cnpj || '—')} · documentos para conferência da implantação</div>
    <div class="card"><div class="resumo">
      <div>Vigência<b>${esc(e.vigencia || '—')}</b></div>
      <div>Vidas<b>${esc(e.vidas || 0)}</b></div>
      <div>Total mensal<b>${esc(e.total || '—')}</b></div>
    </div>
    <div style="margin-top:14px;"><button class="btn prim" id="btnZip" onclick="baixarTudo()">Baixar tudo (.zip)</button>
    <span id="zipStatus" style="font-size:12px;color:var(--muted);margin-left:8px;"></span></div></div>
    <div class="titulo">Documentos da implantação</div>
    <div class="card">${(p.gerais || []).map(linhaArquivo).join('') || '<div class="sub">Nenhum.</div>'}</div>
    <div class="titulo">Documentos da empresa</div>
    <div class="card">${(p.documentosEmpresa || []).map(linhaArquivo).join('') || '<div class="sub">Nenhum.</div>'}</div>
    <div class="titulo">Vidas (${(p.vidas || []).length})</div>
    ${(p.vidas || [])
      .map((v) => `<div class="card"><div class="vida-head"><div><b>${esc(v.nome)}</b><br><small>${esc(v.tipo)}${v.tipo.startsWith('Titular') ? '' : ` de ${esc(v.titular)}`} · CPF ${esc(v.cpf || '—')}</small></div><small>${esc(v.plano)}</small></div>
        <div style="margin-top:8px;">${(v.documentos || []).map(linhaArquivo).join('') || '<div class="sub">Sem documentos.</div>'}</div></div>`)
      .join('')}
    <div class="rodape">Link válido até ${new Date(p.validoAte).toLocaleDateString('pt-BR')}. Os arquivos abrem por links temporários; se algum expirar, atualize a página.</div>`;
}
function extensao(url, tipo) {
  const m = String(url).split('?')[0].match(/\.([a-z0-9]{2,5})$/i);
  if (m) return m[1].toLowerCase();
  if (/pdf/.test(tipo)) return 'pdf';
  if (/sheet|excel/.test(tipo)) return 'xlsx';
  if (/png/.test(tipo)) return 'png';
  if (/jpe?g/.test(tipo)) return 'jpg';
  return 'pdf';
}
function nomeArquivo(t) {
  return String(t || 'arquivo').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^A-Za-z0-9 ()._-]+/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 90);
}
async function baixarTudo() {
  const status = document.getElementById('zipStatus');
  const btn = document.getElementById('btnZip');
  btn.disabled = true;
  const zip = new JSZip();
  const itens = [];
  (PACOTE.gerais || []).forEach((a) => itens.push(['01 Implantacao', a]));
  (PACOTE.documentosEmpresa || []).forEach((a) => itens.push(['02 Empresa', a]));
  (PACOTE.vidas || []).forEach((v, i) => (v.documentos || []).forEach((a) => itens.push([`03 Vidas/${String(i + 1).padStart(2, '0')} ${nomeArquivo(v.nome)}`, a])));
  const falhas = [];
  for (let i = 0; i < itens.length; i++) {
    const [pasta, a] = itens[i];
    status.textContent = `Baixando ${i + 1} de ${itens.length}…`;
    try {
      const res = await fetch(a.url);
      if (!res.ok) throw new Error();
      const blob = await res.blob();
      zip.file(`${pasta}/${nomeArquivo(a.nome)}.${extensao(a.url, blob.type)}`, blob);
    } catch (e) {
      falhas.push(a.nome);
    }
  }
  status.textContent = 'Compactando…';
  const blob = await zip.generateAsync({ type: 'blob' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = `implantacao-${nomeArquivo(PACOTE.empresa.razaoSocial || 'empresa').replace(/ /g, '-').toLowerCase()}.zip`;
  link.click();
  status.textContent = falhas.length ? `Pronto. ${falhas.length} arquivo(s) precisam ser abertos individualmente: ${falhas.join(', ')}` : 'Pronto.';
  btn.disabled = false;
}
async function iniciar() {
  const msgs = { 'link-vencido': 'Este link venceu. Peça um novo à Nossa Corretora.', 'link-cancelado': 'Este link foi cancelado ou não existe.', 'link-invalido': 'Link inválido.' };
  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/pacote-unimed`, {
      method: 'POST',
      headers: { apikey: SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: TOKEN }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(msgs[data.error] || data.error || 'Não foi possível abrir.');
    PACOTE = data;
    render();
  } catch (e) {
    const semConexao = e instanceof TypeError || /fetch/i.test(e.message || '');
    document.getElementById('app').innerHTML = `<div class="erro">${esc(semConexao ? 'Não foi possível abrir a página agora. Verifique a internet e tente de novo em alguns minutos; se continuar, fale com a Nossa Corretora.' : e.message)}</div>`;
  }
}
iniciar();
