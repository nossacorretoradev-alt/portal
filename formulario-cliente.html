<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Complete seus dados — CDL Mossoró × Unimed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#00042D; --navy-soft:#0B1140; --navy-tint:#EEEEF3;
  --green:#159442; --green-bright:#3ECB74; --green-tint:#E8F7EE;
  --warn:#B45309; --warn-tint:#FDF1E2; --cream:#F6F6F8; --line:#E2E2E8;
  --ink:#14141C; --gray:#5B5B66; --gray-soft:#8B8B96;
  --font-display:'Archivo',Arial,sans-serif; --font-body:'Inter',-apple-system,sans-serif;
  --radius:16px; --radius-lg:24px;
  --container:600px;
}
*,*::before,*::after{ box-sizing:border-box; }
body{ margin:0; font-family:var(--font-body); background:var(--cream); color:var(--ink); }
h1,h2,h3{ font-family:var(--font-display); margin:0; }

/* ===== HERO ===== */
.hero{ background:var(--navy); padding:36px 20px 60px; text-align:center; position:relative; overflow:hidden; }
.hero-spiral{ position:absolute; top:-30px; right:-50px; width:260px; height:260px; opacity:.18; pointer-events:none; }
.hero-badge{
  display:inline-flex; align-items:center; gap:7px; background:rgba(255,255,255,0.08); color:#fff;
  font-size:12px; font-weight:600; padding:7px 14px; border-radius:999px; margin-bottom:16px;
  border:1px solid rgba(255,255,255,0.15); position:relative; z-index:1;
}
.hero h1{ color:#fff; font-size:22px; font-weight:800; position:relative; z-index:1; max-width:420px; margin:0 auto; line-height:1.3; }
.hero p{ color:#C7C9DB; font-size:13.5px; margin:10px auto 0; max-width:360px; position:relative; z-index:1; line-height:1.5; }

/* ===== CARD (flutua sobre o hero) ===== */
.wrap{ max-width:var(--container); margin:-34px auto 40px; padding:0 16px; position:relative; z-index:2; }
.card{
  background:#fff; border-radius:var(--radius-lg); box-shadow:0 14px 34px -16px rgba(0,4,45,0.28);
  padding:28px 24px 26px; position:relative; overflow:hidden;
}
.card::before{ content:""; position:absolute; top:0; left:0; right:0; height:5px; background:linear-gradient(90deg,var(--navy),var(--green)); }

/* progresso */
.progress-row{ display:flex; align-items:center; gap:12px; margin-bottom:22px; }
.progress-ring{ width:38px; height:38px; border-radius:50%; flex:0 0 auto; position:relative;
  background:conic-gradient(var(--green) calc(var(--pct,0)*1%), var(--line) 0); transition:background .5s ease; }
.progress-ring::after{ content:""; position:absolute; inset:4px; background:#fff; border-radius:50%; }
.progress-ring span{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:9.5px; font-weight:800; color:var(--navy); }
.progress-label{ font-size:11.5px; font-weight:700; color:var(--gray-soft); text-transform:uppercase; letter-spacing:.03em; }

.step-head{ display:flex; align-items:center; gap:10px; margin-bottom:6px; }
.step-icon{ width:34px; height:34px; border-radius:10px; background:var(--navy-tint); color:var(--navy); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.step-icon svg{ width:18px; height:18px; }
.step-icon.green{ background:var(--green-tint); color:var(--green); }
.eyebrow{ font-size:11.5px; font-weight:700; color:var(--green); text-transform:uppercase; letter-spacing:.04em; }
h2.step-title{ font-size:19px; margin:2px 0 6px; color:var(--navy); }
p.step-sub{ color:var(--gray); font-size:13px; margin:0 0 20px; line-height:1.55; }

/* ===== CAMPOS ===== */
.field-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
@media(max-width:480px){ .field-grid{ grid-template-columns:1fr; } }
.fg{ margin-bottom:14px; }
.fg label{ display:block; font-size:11.5px; font-weight:700; color:var(--navy); text-transform:uppercase; letter-spacing:.02em; margin-bottom:6px; }
.fg input, .fg select{ width:100%; border:1.5px solid var(--line); border-radius:11px; padding:12px 14px; font-size:14.5px; font-family:inherit; background:var(--cream); color:var(--ink); }
.fg input:focus, .fg select:focus{ outline:none; border-color:var(--navy); background:#fff; }
.field-hint{ font-size:11.5px; margin-top:6px; color:var(--gray-soft); min-height:14px; }
.field-hint.ok{ color:var(--green); font-weight:600; }

/* ===== DECLARAÇÃO DE SAÚDE ===== */
.ds-progress{ display:flex; align-items:center; justify-content:space-between; background:var(--cream); border-radius:11px; padding:10px 14px; margin-bottom:16px; font-size:12px; font-weight:700; color:var(--navy); }
.ds-progress .bar{ flex:1; height:6px; background:var(--line); border-radius:99px; margin:0 12px; overflow:hidden; }
.ds-progress .bar i{ display:block; height:100%; background:var(--green); border-radius:99px; transition:width .3s; }
.ds-q-card{ border:1.5px solid var(--line); border-radius:13px; padding:14px 15px; margin-bottom:10px; transition:.15s; }
.ds-q-card.answered-sim{ border-color:var(--warn); background:var(--warn-tint); }
.ds-q-card.answered-nao{ border-color:var(--green); background:var(--green-tint); }
.ds-q-num{ display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px; border-radius:50%; background:var(--navy-tint); color:var(--navy); font-size:10.5px; font-weight:800; flex-shrink:0; margin-right:8px; }
.ds-q-text{ font-size:12.5px; color:var(--ink); line-height:1.5; display:inline; }
.ds-toggle{ display:flex; gap:8px; margin-top:10px; }
.ds-toggle button{ flex:1; padding:9px; border-radius:9px; border:1.5px solid var(--line); background:#fff; font-weight:700; font-size:12.5px; color:var(--gray); cursor:pointer; font-family:inherit; }
.ds-toggle button.active-nao{ border-color:var(--green); background:var(--green); color:#fff; }
.ds-toggle button.active-sim{ border-color:var(--warn); background:var(--warn); color:#fff; }
.ds-detail{ margin-top:9px; display:none; }
.section-title{ font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.04em; color:var(--green); margin:22px 0 12px; padding-top:6px; border-top:1px dashed var(--line); }
.section-title:first-of-type{ border-top:none; margin-top:4px; }

/* ===== BOTÕES ===== */
.q-actions{ display:flex; gap:10px; margin-top:22px; }
.btn{ font-family:var(--font-display); font-weight:800; font-size:14.5px; padding:14px 20px; border-radius:999px; border:none; cursor:pointer; }
.btn-primary{ background:var(--navy); color:#fff; flex:1; }
.btn-primary:hover{ background:#000220; }
.btn-primary:disabled{ opacity:.4; cursor:not-allowed; }
.btn-ghost{ background:var(--cream); color:var(--gray); flex:0 0 auto; }
.btn-block{ width:100%; }

/* ===== TELAS ESPECIAIS ===== */
.intro-icon{ width:52px; height:52px; border-radius:16px; background:var(--green-tint); color:var(--green); display:flex; align-items:center; justify-content:center; margin:0 auto 16px; }
.intro-icon svg{ width:26px; height:26px; }
.checklist{ text-align:left; margin:18px 0; }
.checklist li{ list-style:none; display:flex; gap:10px; align-items:flex-start; font-size:13px; color:var(--gray); margin-bottom:10px; line-height:1.4; }
.checklist svg{ width:16px; height:16px; color:var(--green); flex-shrink:0; margin-top:2px; }

.success-icon{ width:60px; height:60px; border-radius:50%; background:var(--green); color:#fff; display:flex; align-items:center; justify-content:center; font-size:28px; margin:0 auto 18px; }
.loading, .error-box{ text-align:center; padding:50px 10px; }
.error-box h2{ color:var(--warn); font-size:18px; margin-bottom:8px; }
.error-box p{ color:var(--gray); font-size:13.5px; }
.spinner{ width:30px; height:30px; border-radius:50%; border:3px solid var(--line); border-top-color:var(--navy); margin:0 auto 14px; animation:spin .8s linear infinite; }
@keyframes spin{ to{ transform:rotate(360deg); } }

.footnote{ text-align:center; font-size:11px; color:var(--gray-soft); margin-top:16px; line-height:1.5; }
.footnote svg{ width:12px; height:12px; vertical-align:-1px; margin-right:3px; }
</style>

function supabaseHeaders(extra) {
  // Chave nova do Supabase (sb_publishable_) não é JWT — mandar ela também no
  // header Authorization faz o Supabase tentar decodificar como JWT e rejeitar
  // com 401. Só entra no header "apikey".
  return Object.assign({ apikey: SUPABASE_ANON_KEY }, extra || {});
}
async function buscarFormularioPublico(numeroCliente, codigoEmpresa, codigoVida) {
  const url = `${SUPABASE_URL}/functions/v1/public-questionario`;
  const res = await fetch(url, {
    method: 'POST',
    headers: supabaseHeaders({ 'Content-Type': 'application/json' }),
    body: JSON.stringify({
      action: 'get',
      numeroCliente,
      codigoEmpresa,
      codigoVida,
    }),
  });
  const result = await res.json();
  if (!res.ok) throw new Error(result.error || 'Falha ao buscar dados: ' + res.status);
  return result;
}
async function enviarFormularioPublico(numeroCliente, codigoEmpresa, endereco, pessoas) {
  const url = `${SUPABASE_URL}/functions/v1/public-questionario`;
  const res = await fetch(url, {
    method: 'POST',
    headers: supabaseHeaders({ 'Content-Type': 'application/json' }),
    body: JSON.stringify({
      action: 'submit',
      numeroCliente,
      codigoEmpresa,
      endereco,
      pessoas,
    }),
  });
  const result = await res.json();
  if (!res.ok) throw new Error(result.error || 'Falha ao salvar: ' + res.status);
  return result;
}

function listPessoasPublico(c) {
  const todas = [
    { key: 'titular', label: c.titular.nome || 'Titular', tipo: 'Titular', pessoa: c.titular },
  ].concat(
    c.dependentes.map((d, i) => ({
      key: 'dep' + i,
      label: d.nome || 'Dependente ' + (i + 1),
      tipo: i + 1 + 'º Dependente',
      pessoa: d,
    }))
  );
  return VIDA_CODIGO ? todas.filter((p) => p.pessoa.codigoVida === VIDA_CODIGO) : todas;
}

async function boot() {
  const app = document.getElementById('app');
  if (!CLIENT_NUMERO) {
    showError('Link inválido', 'Faltam informações no link. Peça um novo link para a CDL Mossoró.');
    return;
  }
  try {
    // A validação de empresa (EMPRESA_CODIGO) e de vida (VIDA_CODIGO) agora
    // já acontece dentro da Edge Function, no servidor — não precisa mais
    // repetir aqui.
    CLIENT = await buscarFormularioPublico(CLIENT_NUMERO, EMPRESA_CODIGO, VIDA_CODIGO);
    const pessoas = listPessoasPublico(CLIENT);
    if (!pessoas.length) {
      showError(
        'Vida não encontrada',
        'O código individual desta vida não foi localizado. Peça um novo link à CDL Mossoró.'
      );
      return;
    }
    STEPS = ['intro', 'endereco', ...pessoas.map((p) => 'pessoa:' + p.key)];
    document.getElementById('heroSub').textContent =
      CLIENT.titular.razaoSocial || 'CDL Mossoró × Unimed';
    renderStep();
  } catch (e) {
    console.warn('boot error:', e);
    const msg = (e.message || '').toLowerCase();
    if (
      msg.includes('403') ||
      msg.includes('rls') ||
      msg.includes('unauthorized') ||
      msg.includes('permission')
    ) {
      showError(
        'Acesso não autorizado',
        'O servidor não conseguiu carregar seus dados. Entre em contato com a CDL Mossoró e informe o código do erro: RLS-403.'
      );
    } else if (msg.includes('empresa-invalida')) {
      showError(
        'Link inválido',
        'O código da empresa não corresponde a este cadastro. Peça um novo link à CDL Mossoró.'
      );
    } else if (msg.includes('not-found') || msg.includes('not found') || msg.includes('404')) {
      showError(
        'Cadastro não encontrado',
        'Não localizamos seus dados com este link. Fale com a CDL Mossoró para receber um novo link.'
      );
    } else {
      showError(
        'Não foi possível carregar',
        'Verifique sua internet e tente abrir o link de novo em alguns instantes. (' +
          (e.message || 'erro desconhecido') +
          ')'
      );
    }
  }
}
function showError(title, msg) {
  document.getElementById('app').innerHTML =

}

function updateProgress() {
  const pct = Math.round((STEP_IDX / STEPS.length) * 100);
  const ring = document.getElementById('progressRing');
  if (ring) {
    ring.style.setProperty('--pct', pct);
    document.getElementById('progressPct').textContent = pct + '%';
  }
}

function renderStep() {
  const stepId = STEPS[STEP_IDX];
  const app = document.getElementById('app');
  if (stepId === 'intro') {
    renderIntro(app);
    return;
  }
  if (stepId === 'endereco') {
    renderEndereco(app);
    return;
  }
  if (stepId.startsWith('pessoa:')) {
    renderPessoa(app, stepId.split(':')[1]);
    return;
  }
}

function frameShell(inner, opts) {
  opts = opts || {};

function saveEnderecoAndNext() {

let cepTimer = null;
function onCepInput(e) {
  let v = onlyDigits(e.target.value).slice(0, 8);
  e.target.value = v.replace(/^(\d{5})(\d)/, '$1-$2');
  clearTimeout(cepTimer);
  if (v.length === 8) {
    cepTimer = setTimeout(() => lookupCep(v), 300);
  }
}
async function lookupCep(digits) {
  const statusEl = document.getElementById('cepStatus');
  if (!statusEl) return; // a pessoa já saiu dessa etapa antes da busca terminar
  statusEl.textContent = 'Buscando endereço...';
  statusEl.className = 'field-hint';
  try {
    const r = await fetch(`https://viacep.com.br/ws/${digits}/json/`);
    const data = await r.json();
    const statusEl2 = document.getElementById('cepStatus');
    if (!statusEl2) return;
    if (data.erro) {
      statusEl2.textContent = 'CEP não encontrado — preencha manualmente.';
      return;
    }
    const enderecoEl = document.getElementById('f_endereco');
    if (!enderecoEl) return;
    enderecoEl.value = data.logradouro || '';
    document.getElementById('f_bairro').value = data.bairro || '';
    document.getElementById('f_cidade').value = data.localidade || 'Mossoró';
    statusEl2.textContent = 'Endereço preenchido — confira o número.';
    statusEl2.className = 'field-hint ok';
  } catch (e) {
    const statusEl3 = document.getElementById('cepStatus');
    if (statusEl3) statusEl3.textContent = 'Não conseguimos buscar agora — preencha manualmente.';
  }
}

function renderPessoa(app, key) {

    DS_QUESTIONS.filter((q, i) => ans['q' + i] !== undefined).length +
    DS_FAMILY_QUESTIONS.filter((q, i) => ans['f' + i] !== undefined).length;

  app.innerHTML = frameShell(

        <option value="5" ${CLIENT.titular.estadoCivil === '5' ? 'selected' : ''}>União estável</option>

        : ''
    }

      <span style="color:var(--gray-soft);font-weight:600;">respondidas</span>

    </div>

  `,
    { label: p.tipo }
  );

function dsQuestionCard(prefix, i, text, ans, noDetail) {
  const val = ans[prefix + i];
  const cls = val === 'Sim' ? 'answered-sim' : val === 'Não' ? 'answered-nao' : '';
  return `
    <div class="ds-q-card ${cls}" id="dsCard_${prefix}${i}">
      <div><span class="ds-q-num">${i + 1}</span><span class="ds-q-text">${text}</span></div>
      <div class="ds-toggle">
        <button type="button" id="btn_${prefix}${i}_nao" class="${val === 'Não' ? 'active-nao' : ''}" onclick="setDs('${prefix}',${i},false,${!!noDetail})">Não</button>
        <button type="button" id="btn_${prefix}${i}_sim" class="${val === 'Sim' ? 'active-sim' : ''}" onclick="setDs('${prefix}',${i},true,${!!noDetail})">Sim</button>
      </div>
      ${noDetail ? '' : `<input class="ds-detail" id="det_${prefix}${i}" placeholder="Especifique" value="${ans[prefix + i + '_det'] || ''}" style="display:${val === 'Sim' ? 'block' : 'none'};">`}
    </div>`;
}
function setDs(prefix, i, isSim, noDetail) {
  const key = STEPS[STEP_IDX].split(':')[1];
  const ans = ANSWERS[key] || (ANSWERS[key] = {});
  ans[prefix + i] = isSim ? 'Sim' : 'Não';
  document.getElementById(`btn_${prefix}${i}_nao`).classList.toggle('active-nao', !isSim);
  document.getElementById(`btn_${prefix}${i}_sim`).classList.toggle('active-sim', isSim);
  const card = document.getElementById(`dsCard_${prefix}${i}`);
  card.classList.toggle('answered-sim', isSim);
  card.classList.toggle('answered-nao', !isSim);
  if (!noDetail) {
    const det = document.getElementById(`det_${prefix}${i}`);
    det.style.display = isSim ? 'block' : 'none';
  }
  // atualiza contador
  const totalQ = DS_QUESTIONS.length + DS_FAMILY_QUESTIONS.length;
  const respondidas =
    DS_QUESTIONS.filter((q, idx) => ans['q' + idx] !== undefined).length +
    DS_FAMILY_QUESTIONS.filter((q, idx) => ans['f' + idx] !== undefined).length;
  document.getElementById('dsCount').textContent = respondidas + '/' + totalQ;
  document.getElementById('dsBar').style.width = Math.round((respondidas / totalQ) * 100) + '%';
}
function savePessoaData(key) {
  const ans = ANSWERS[key] || (ANSWERS[key] = {});
  ans.sexoInput = document.getElementById('p_sexo').value;
  ans.maeInput = document.getElementById('p_mae').value;
  ans.peso = document.getElementById('p_peso').value;
  ans.altura = document.getElementById('p_altura').value;
  const civilEl = document.getElementById('p_civil');
  if (civilEl) ans.civilInput = civilEl.value;
  DS_QUESTIONS.forEach((q, i) => {
    const det = document.getElementById('det_q' + i);
    if (det) ans['q' + i + '_det'] = det.value;
  });
}
function savePessoaAndNext(key) {
  savePessoaData(key);
  if (STEP_IDX === STEPS.length - 1) {
    enviarFormulario();
  } else {
    goNext();
  }
}

function goNext() {
  if (STEP_IDX < STEPS.length - 1) {
    STEP_IDX++;
    renderStep();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}
function goPrev() {
  if (STEP_IDX > 0) {
    STEP_IDX--;
    renderStep();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

async function enviarFormulario() {
  const btn = document.getElementById('pessoaNextBtn');
  if (btn) {
    btn.disabled = true;
    btn.textContent = 'Enviando...';
  }

  const c = CLIENT;
  const pessoasPayload = [];
  const pessoas = listPessoasPublico(c);
  pessoas.forEach((p) => {
    const ans = ANSWERS[p.key] || {};
    const ds = {};
    DS_QUESTIONS.forEach((q, i) => {
      ds['q' + i] = ans['q' + i] || 'Não';
      if (ds['q' + i] === 'Sim') ds['q' + i + '_det'] = ans['q' + i + '_det'] || '';
    });
    DS_FAMILY_QUESTIONS.forEach((q, i) => {
      ds['f' + i] = ans['f' + i] || 'Não';
    });
    ds.peso = ans.peso;
    ds.altura = ans.altura;
    pessoasPayload.push({
      key: p.key,
      sexo: ans.sexoInput || undefined,
      nomeMae: ans.maeInput || undefined,
      estadoCivil: p.key === 'titular' ? ans.civilInput || undefined : undefined,
      dsRespostas: ds,
    });
  });

  try {
    await enviarFormularioPublico(CLIENT_NUMERO, EMPRESA_CODIGO, ENDERECO, pessoasPayload);
    showSuccess();
  } catch (e) {
    console.warn(e);
    if (btn) {
      btn.disabled = false;
      btn.textContent = 'Enviar meus dados';
    }
    alert('Não foi possível enviar agora. Verifique sua internet e tente novamente.');
  }
}

function showSuccess() {
  document.getElementById('app').innerHTML = frameShell(
    `
    <div style="text-align:center;">
      <div class="success-icon">${ICONS.check}</div>
      <h2 class="step-title">Recebemos seus dados!</h2>
      <p class="step-sub">Obrigado por completar as informações. Nosso time da CDL Mossoró já está com tudo em mãos pra dar andamento à sua adesão junto à Unimed.</p>
    </div>
  `,
    { noProgress: true }
  );
}

document.getElementById('footnoteArea').innerHTML =
  `<p class="footnote">${ICONS.lock} Seus dados são de responsabilidade da Nossa Corretora de Seguros e usados só para sua adesão junto à CDL Mossoró e Unimed, em conformidade com a LGPD.</p>`;
boot();
</script>
